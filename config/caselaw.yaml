        page_size: 50
        src: |
            SELECT ?entity ?no ?casename ?court ?date ?disposition
            WHERE {
                $collection
                ?entity caselawp:id ?id ;
                        churoip:no ?no .
                OPTIONAL { ?t a caselawo:Trial ; caselawp:id ?id .
                           OPTIONAL { ?t caselawp:casename ?casename }
                           OPTIONAL { ?t caselawp:court ?court } }
                OPTIONAL { ?j a caselawo:Judgment ; caselawp:id ?id .
                           OPTIONAL { ?j caselawp:judgmentdate ?date }
                           OPTIONAL { ?j caselawp:disposition ?disposition } }
            }
