-   def: gadget
    name: CaseLawInfo
    height: 700
    get:
        type: sparql
        src: |
            select ?caseno ?casename ?casecategory ?casecategorylabel ?holding ?headnote ?court ?judgmentdate ?result ?category ?pdf ?id ?year ?npages where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?trialid a caselawo:Trial; caselawp:id ?id .
                ?judgmentid a caselawo:Judgment; caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                ?docid caselawp:year ?year .
                OPTIONAL {?trialid caselawp:caseno ?caseno}
                OPTIONAL {?trialid caselawp:casename ?casename}
                OPTIONAL {?trialid caselawp:casecategory ?casecategory. ?casecategory rdfs:label ?casecategorylabel}
                OPTIONAL {?judgmentid caselawp:判示事項 ?holding}
                OPTIONAL {?judgmentid caselawp:裁判要旨 ?headnote}
                OPTIONAL {?trialid caselawp:court ?court}
                OPTIONAL {?judgmentid caselawp:judgmentdate ?judgmentdate}
                OPTIONAL {?judgmentid caselawp:disposition|caselawp:judgment_result ?result}
                OPTIONAL {?docid caselawp:caselawcategory ?category}
                OPTIONAL {?docid foaf:primaryTopic ?pdf}
                OPTIONAL {?docid dcterms:extent ?npages}
            }}
    show: 
        type: vtable
        columns:
            - id: caseno
              label: 事件番号
              width: 100
            - id: casename
              label: 事件名
            - id: casecategorylabel
              label: 事件区分
              link: casecategory
            - id: holding
              label: 判示事項
            - id: headnote
              label: 裁判要旨
            - id: court
              label: 裁判所
              display: localname
            - id: judgmentdate
              label: 判決言い渡し日
            - id: result
              label: 結果/判決結果
              display: localname
            - id: category
              label: 判例カテゴリ
              display: localname
            - id: id
              label: ID
            - id: pdf
              label: 判例PDF文書URI
              type: directlink
            - id: npages
              label: PDFページ数
            - id: year
              label: HTML文書
              type: directlink
              string: "HTML文書"
              href: "/data/?year/?{id}_hanrei.html"
-   def: gadget
    name: DocInfo
    get:
        type: sparql
        src: |
            select ?npages ?ndiv ?nspan ?nbr ?ntext ?stpat ?producer ?creator ?creationdate ?moddate where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                ?docid dcterms:extent ?npages;
                caselawp:divCount ?ndiv; 
                caselawp:spanCount ?nspan; 
                caselawp:brCount ?nbr; 
                caselawp:textBlockCount ?ntext;
                caselawp:judicalopstruct ?stpat .
                OPTIONAL {?docid caselawp:pdfProducerTool ?producer}
                OPTIONAL {?docid caselawp:pdfCreatorTool ?creator}
                OPTIONAL {?docid prism:creationDate ?creationdate}
                OPTIONAL {?docid prism:modificationDate ?moddate}
            }}
    show: 
        type: vtable
        columns:
            - id: npages
              label: ページ数
            - id: ndiv
              label: div数
            - id: nspan
              label: span数
            - id: nbr
              label: br数
            - id: ntext
              label: テキストブロック数
            - id: stpat
              label: セクションシーケンス
              display: localname
            - id: producer
              label: PDF作成ツール
            - id: creator
              label: 文書作成ツール
            - id: creationdate
              label: PDF作成日
            - id: moddate
              label: PDF修正日
-   def: gadget
    name: Profile
