-   def: gadget
    name: LawConceptClause
    # 語のページで共通。同じラベルの法令の語（law:<語>。定義語・特徴語・条見出し）について（2026.11.5）
    focus: '$uri rdfs:label ?l . ?new rdfs:label ?l . VALUES ?t { lawo:Term lawo:Keyword skos:Concept } ?new a ?t . FILTER(STRSTARTS(STR(?new), "http://lod4all.net/law/resource/"))'
    title: この見出しの条
    # 条見出し（lawp:caption）がこの概念の条（toc2rdf.ttl: law:reg_<条> lawp:realize <条> ; lawp:related <概念>）。
    # 共通見出し（前の条の見出しを受け継ぐ条。commoncaption.ttl）も出す
    get:
        type: sparql
        src: |
            # 条のラベルは「会社法304条」「会社法第三百四条」の2つがあるので、条ごとに1行にする（MIN で算用数字のほう。2026.11.5）
            select ?clause (MIN(STR(?cl)) AS ?clauselabel) ?law (MIN(STR(?ll)) AS ?lawlabel) ?kind where {
                { ?reg lawp:related $uri ; lawp:realize ?clause . BIND("見出し" AS ?kind) }
                UNION
                { $uri rdfs:label ?label . ?clause lawp:commonCaption ?label . BIND("共通見出し" AS ?kind) }
                OPTIONAL {?clause rdfs:label ?cl}
                OPTIONAL {?clause lawp:law ?law . OPTIONAL {?law rdfs:label ?ll}}
            } group by ?clause ?law ?kind
            order by ?lawlabel ?clause
            limit 200
    show:
        type: htable
        columns:
            - id: lawlabel
              label: 法令
              link: law
              width: 220
            - id: clauselabel
              label: 条
              link: clause
              width: 160
            - id: kind
              label: 見出しの種類
              width: 100
-   def: gadget
    name: LawConceptCaseLaw
    # 語のページで共通。同じラベルの法令の語（law:<語>。定義語・特徴語・条見出し）について（2026.11.5）
    focus: '$uri rdfs:label ?l . ?new rdfs:label ?l . VALUES ?t { lawo:Term lawo:Keyword skos:Concept } ?new a ?t . FILTER(STRSTARTS(STR(?new), "http://lod4all.net/law/resource/"))'
