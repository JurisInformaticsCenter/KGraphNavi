            - JudicalOpinionStructPie
            - JudicalOpinionStruct
        # 量刑（hanrei の src/sentencing.py の sentencing.ttl。罪名・量刑の種類・刑期で絞り込んで比べる。2026.11.7）
        - label: 量刑
          lazy: true
          gadget:
            - SentenceKindBar
            - SentenceYearsBar
            - SentenceSuspendedYearsBar
            - SentenceList
        # 順位表（get.type: rank。統計ページの設計の第一段。選ばれたときだけ計算する。2026.10.20）
        - label: 参照の多い判例
          lazy: true
          gadget:
            - RankCitedCase
        # 判例の参照関係のネットワーク図（show: type: graph。2026.10.28）
        - label: 参照関係
          lazy: true
          gadget:
            - CitationNetwork
        # 判例と、判断の中で参照している法令の条（または法令）の二部グラフ（2026.10.28）
        - label: 参照法令の図
          lazy: true
          gadget:
            - RefLawNetwork
        - label: 参照の多い法令の条
          lazy: true
          gadget:
            - RankRefLawCoreClause
        - label: 参照の多い法令
          lazy: true
          gadget:
            - RankRefLawCore
-   def: gadget
    name: CitationNetwork
    # コレクションの判例の参照関係(caselawp:citedcaselaw: 本文で参照している事件をデータ中の判例に照合したもの)。
    # 参照先がコレクション外の判例は既定では出さない（画面で「コレクション外の参照先も表示する」）。2026.10.28
    title: 判例の参照関係
    get:
        type: sparql
        max_rows: 50000
        src: |
            SELECT ?entity ?label ?year ?cited ?citedlabel ?citedyear ?procedure ?instance
            WHERE {
                $collection
                ?entity caselawp:citedcaselaw ?cited .
                OPTIONAL { ?entity rdfs:label ?label }
                OPTIONAL { ?entity caselawp:year ?year }
                OPTIONAL { ?entity caselawp:procedure ?pr . ?pr skos:broader* ?ptop .
                           ?ptop skos:topConceptOf caselawo:手続体系 ; rdfs:label ?procedure }
                OPTIONAL { ?entity caselawp:instance ?inst . ?inst rdfs:label ?instance }
                OPTIONAL { ?cited rdfs:label ?citedlabel }
                OPTIONAL { ?cited caselawp:year ?citedyear }
            }
    show:
        type: graph
        edges:
            - {from: entity, to: cited}
        nodes:
            # 属性（手続・審級）は画面の「色」で切り替える（2026.11.9）
            entity: {label: label, kind: 判例, x: year, attrs: {procedure: procedure, instance: instance}}
            cited: {label: citedlabel, kind: 判例, x: citedyear, in_collection: check}
        encode:
            color: [kind, procedure, instance, year, component]
            size: [indegree, outdegree, pagerank, none]
            labels: {procedure: 手続, instance: 審級, kind: コレクションの内・外}
        outside: hide
        layout: timeline
        select_class: caselawo:CaseLawDocument   # 範囲選択した判例を保存するときのクラス
        max_nodes: 500
        height: 640
-   def: gadget
    name: RefLawNetwork
    # コレクションの判例と、判断の中で参照している法令の条(caselawp:reflawCore)の二部グラフ。
    # 条は順位表(RankRefLawCoreClause)と同じく、条の単位(law:<法令ID>_<条>)だけ。「条／法令」を画面で切り替える
    # (v.RefLawNetwork=law)。多くの判例に共通する条を見るため、既定では2件以上の判例が参照する条だけ出す。2026.10.28
    title: 判例と参照法令
    get:
        type: sparql
        max_rows: 50000
        src: |
            SELECT ?entity ?label ?year ?article ?articlelabel ?procedure ?instance
            WHERE {
                $collection
                ?entity caselawp:reflawCore ?article .
                ?article a lawo:Clause .
                FILTER(!CONTAINS(STRAFTER(STR(?article), "_"), "_"))
                OPTIONAL { ?entity rdfs:label ?label }
                OPTIONAL { ?entity caselawp:year ?year }
                OPTIONAL { ?entity caselawp:procedure ?pr . ?pr skos:broader* ?ptop .
                           ?ptop skos:topConceptOf caselawo:手続体系 ; rdfs:label ?procedure }
                OPTIONAL { ?entity caselawp:instance ?inst . ?inst rdfs:label ?instance }
                OPTIONAL { ?article rdfs:label ?articlelabel }
            }
    show:
        type: graph
        edges:
            - {from: entity, to: article, directed: false}
        nodes:
            entity: {label: label, kind: 判例, x: year, shape: ellipse, attrs: {procedure: procedure, instance: instance}}
            article: {label: articlelabel, kind: 条, shape: round-rectangle, min_degree: 2,
                      collection: {facet: reflaw_core_clause}}
        encode:
            color: [kind, procedure, instance, year, component]
            size: [degree, pagerank, none]
            labels: {procedure: 手続, instance: 審級}
        layout: bipartite
        select_class: caselawo:CaseLawDocument
        max_nodes: 600
        height: 640
    variants:
        - name: clause
          label: 条
        - name: law
          label: 法令
          get:
              src: |
                  SELECT DISTINCT ?entity ?label ?year ?article ?articlelabel ?procedure ?instance
                  WHERE {
                      $collection
                      ?entity caselawp:reflawCore ?clause .
                      ?clause lawp:law ?article .
                      OPTIONAL { ?entity rdfs:label ?label }
                      OPTIONAL { ?entity caselawp:year ?year }
                      OPTIONAL { ?entity caselawp:procedure ?pr . ?pr skos:broader* ?ptop .
                                 ?ptop skos:topConceptOf caselawo:手続体系 ; rdfs:label ?procedure }
                      OPTIONAL { ?entity caselawp:instance ?inst . ?inst rdfs:label ?instance }
                      OPTIONAL { ?article rdfs:label ?articlelabel }
                  }
          show:
              nodes:
                  entity: {label: label, kind: 判例, x: year, attrs: {procedure: procedure, instance: instance}}
                  article: {label: articlelabel, kind: 法令, shape: round-rectangle, min_degree: 2,
                            collection: {facet: reflaw_core}}
        # 片側への射影（2026.10.28）。条どうしを、両方を参照する判例の数で結ぶ（共参照）
        - name: cocited
          label: 一緒に参照される条
          show:
              project: {keep: article, via: entity, min_weight: 2}
              layout: force
        # 判例どうしを、共通して参照する条の数で結ぶ（書誌結合）。多くの判例が参照する条（200件を超える判例と
        # つながる条）は、組が膨らむうえ似ていることの手がかりにならないので使わない
        - name: coupling
          label: 同じ条を参照する判例
          show:
              project: {keep: entity, via: article, min_weight: 2, max_shared: 200}
              layout: force
-   def: gadget
