-   def: gadget
    name: CaseNumberInfo
    # 事件番号の通称・説明(Wikipediaの記事。caseinfo.ttl)。rdfs:label は info.ttl の「昭和62(あ)1351」を使う(caseinfo.ttl の「C昭和62あ1351」は除く)
    get:
        type: sparql
        src: |
            select (sample(?l) as ?label) (group_concat(distinct ?pn; separator=" / ") as ?popularname)
                   (sample(?ab) as ?abstract) (sample(?sa) as ?sameas) where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:label ?l .
                FILTER (!STRSTARTS(STR(?l), "C"))
                OPTIONAL {$uri caselawp:popularname ?pn}
                OPTIONAL {$uri rdfs:comment ?ab}
                OPTIONAL {$uri owl:sameAs ?sa}
            }}
    show:
        type: vtable
        columns:
            - id: label
              label: 事件番号
              width: 100
            - id: popularname
              label: 通称
            - id: sameas
              label: Wikipedia（DBpedia）
              type: directlink
            - id: abstract
              label: 説明
-   def: gadget
    name: CaseNumberMentions
    # この事件に触れているWikipediaの記事(人物・団体・罪名などの記事。caseinfo.ttl の rdfs:seeAlso)。
    # 記事の名前は DBpedia のリソースの名前(ja.dbpedia.org/resource/ の後)、リンクは Wikipedia の記事(2026.10.18)
    get:
        type: sparql
        src: |
            select ?name ?wikipedia ?see where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:seeAlso ?see .
                BIND (REPLACE(STR(?see), "^https?://ja.dbpedia.org/resource/", "") as ?name)
                BIND (CONCAT("https://ja.wikipedia.org/wiki/", ENCODE_FOR_URI(?name)) as ?wikipedia)   # 文字化けしないよう符号化してからつなぐ
            }} order by ?name
    show:
        type: htable
        columns:
            - id: name
              label: この事件に触れている記事（Wikipedia）
              type: directlink
              href: "?wikipedia"
              width: 300
            - id: see
              label: DBpedia
              type: directlink
              width: 300
