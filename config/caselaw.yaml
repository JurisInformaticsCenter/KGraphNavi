    name: Party
    get:
        type: sparql
        src: |
            select ?role ?person (sample(?s) as ?side) where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?trialid a caselawo:Trial; caselawp:id ?id .
                ?judgmentid a caselawo:Judgment; caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                ?trialid caselawp:party ?pr .
                ?pr caselawp:role ?role;
                    caselawp:person ?person .
                # 代理人などが代理する当事者の側（2026.10.17）
                optional { ?trialid caselawp:counsel ?co . ?co caselawp:person ?person; caselawp:side ?s . }
