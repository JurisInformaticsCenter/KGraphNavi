-   def: gadget
    name: RankOpinionRatio
    title: 個別意見の割合（関与した最高裁の裁判のうち、個別意見を書いた割合。左の「種類」で反対意見に絞ると反対意見の割合）
    # measure: ratio（2026.10.21）。分子はこのコレクションの個別意見の数、分母はその裁判官が関与した最高裁の裁判の数
    get:
        type: rank
        facet: op_author
        measure: ratio
        min_denominator: 20
        page_size: 50
        list_tab: 0
        denominator: |
            SELECT ?value (COUNT(DISTINCT ?t) AS ?denominator) WHERE {
                ?t a caselawo:Trial ; caselawp:court ?court ; caselawp:judge/caselawp:person ?value .
                FILTER(STRSTARTS(STR(?court), "http://ds.rois.ac.jp/caselaw/ontology/最高裁判所"))
            } GROUP BY ?value
    show:
        type: rank
        value_label: 裁判官
        label: 個別意見の数
        denominator_label: 関与した最高裁の裁判
        ratio_label: 割合
        chart: bar
