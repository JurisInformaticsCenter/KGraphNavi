              width: 100
-   def: gadget
    name: RankOpinionAuthor
    title: 個別意見の多い裁判官（左の「種類」で反対意見などに絞り込める）
    get:
        type: rank
        facet: op_author
        page_size: 50
        list_tab: 0
        detail: |
            SELECT ?value (COUNT(DISTINCT ?t) AS ?trials) WHERE {
                $values
                ?t a caselawo:Trial ; caselawp:judge/caselawp:person ?value .
            } GROUP BY ?value
    show:
        type: rank
        value_label: 裁判官
        label: 個別意見の数
        chart: bar
        columns:
            - id: trials
