-   def: gadget
    name: LawDefinition
    title: 法令上の定義
    # 法令の定義規定で、この語を定義しているもの(~/nii/law の defword.ttl。2026.10.20)。
    # 法令の定義語は law:<語>(lawo:Term)で、判例のターム caselaw:<語> とはラベルの文字列で結ぶ。
    # 同じ語でも法令ごとに意味が違うことがあるので、法令・条項と一緒に出す
    get:
        type: sparql
        src: |
            select distinct ?body ?clause ?clauselabel ?law ?lawlabel where {
                $uri rdfs:label ?label .
                ?lt a lawo:Term ; rdfs:label ?label .
                ?def a lawo:Definition ;
                     oa:hasBody ?b ;
                     oa:hasTarget ?tgt .
                ?b lawp:term ?lt ; lawp:body ?body .
                ?tgt oa:hasSource ?s .
                ?s lawp:clause ?clause ; lawp:law ?law .
                OPTIONAL {?clause rdfs:label ?clauselabel . FILTER (CONTAINS(STR(?clauselabel), "第"))}
                OPTIONAL {?law rdfs:label ?lawlabel}
            } order by ?lawlabel ?clause
            limit 200
    show:
        type: htable
        group_by: clause
        columns:
            - id: body
              label: 法令上の定義（2022年10月の版）
              width: 420
            - id: clauselabel
              label: 条項
              link: clause
              width: 220
# 語の概要: この語が、判例のターム・論点事案キーワード・法令の定義語・特徴語・条見出しのどれにあたるか（ラベルで結ぶ。2026.11.5）
-   def: gadget
    name: TermOverview
    title: この語（判例と法令）
    get:
        type: sparql
        src: |
            SELECT ?kind ?item ?ext (COUNT(DISTINCT ?x) AS ?n) WHERE {
                $uri rdfs:label ?label .
                { ?item a caselawo:Term ; rdfs:label ?label . BIND(0 AS ?ord) BIND("判例のターム（この語を含む判例）" AS ?kind)
                  OPTIONAL { graph <http://ds.rois.ac.jp/caselaw/> { ?x dcterms:subject ?item } } }
                UNION { ?item a caselawo:Term ; rdfs:label ?label . BIND(1 AS ?ord) BIND("論点・事案キーワード（判例）" AS ?kind)
                  graph <http://ds.rois.ac.jp/caselaw/> { ?x caselawp:論点キーワード|caselawp:事案キーワード ?item } }
                UNION { ?item a lawo:Term ; rdfs:label ?label . BIND(2 AS ?ord) BIND("法令の定義語（定義規定）" AS ?kind)
                  OPTIONAL { ?b lawp:term ?item . ?x oa:hasBody ?b } }
                UNION { ?item a skos:Concept ; rdfs:label ?label . FILTER(STRSTARTS(STR(?item), "http://lod4all.net/law/resource/"))
                  BIND(3 AS ?ord) BIND("法令の条見出し（条）" AS ?kind)
                  OPTIONAL { ?x lawp:related ?item } }
                UNION { ?item a lawo:Keyword ; rdfs:label ?label . BIND(4 AS ?ord) BIND("法令の特徴語（条）" AS ?kind)
                  OPTIONAL { ?x lawp:word ?item } }
                UNION { ?s rdfs:label ?label ; rdfs:seeAlso ?ext . VALUES ?st { lawo:Term lawo:Keyword } ?s a ?st .
                  BIND(5 AS ?ord) BIND("関連する項目（DBpedia）" AS ?kind) }
                UNION { ?s a caselawo:Term ; rdfs:label ?label ; owl:sameAs ?ext . BIND(5 AS ?ord) BIND("関連する項目（DBpedia）" AS ?kind) }
            } GROUP BY ?ord ?kind ?item ?ext ORDER BY ?ord ?item
    show:
        type: htable
        columns:
            - id: kind
              type: literal
              label: この語にあたるもの
              width: 240
            - id: item
              type: link
              display: localname
              label: 項目
              width: 200
            - id: n
              type: literal
              label: 数
              width: 80
            - id: ext
              type: directlink
              label: 外部
              width: 220
# 語の説明: DBpedia（Wikipedia）の概要（hanrei の src/wikimatch.py の dbpedia.ttl。判例のタームの rdfs:comment と owl:sameAs）。
# 法令の語のページでも、同じラベルの判例のタームのものを出す。Wikipedia の説明なので、法令上の意味とは違うことがある（2026.11.5）
