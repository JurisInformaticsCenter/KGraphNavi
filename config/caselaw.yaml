        time: "http://www.w3.org/2006/time#"
-   sample:
        search:
            - 宮川美津子
        resource:
            - http://ds.rois.ac.jp/caselaw/resource/D020518,休職処分取消事件
            - http://ds.rois.ac.jp/caselaw/resource/C昭和62あ1351,ロッキード事件
            - http://ds.rois.ac.jp/caselaw/resource/尾島明,尾島明（裁判官）
            - http://ds.rois.ac.jp/caselaw/resource/平木正洋,平木正洋（裁判官）
            - http://ds.rois.ac.jp/caselaw/resource/富士通株式会社,富士通株式会社
            - http://lod4all.net/law/resource/332AC0000000026_70-4,租税特別措置法第七十条の四
            - http://ds.rois.ac.jp/caselaw/resource/パロディー写真,パロディー写真
            - http://ds.rois.ac.jp/caselaw/resource/CaseCategory_配チ,配偶者暴力に関する保護命令事件
