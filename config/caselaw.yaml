-   title: caselaw
-   describe: 日本の判例に関するデータ
-   rdfstore: virtuoso
-   label: rdfs:label
# 検索では異表記（skos:altLabel。けん銃/拳銃、覚せい剤/覚醒剤、旧字・長音・送り仮名の違い。hanrei の src/termvariant.py）でも引く（2026.11.11）
-   search_label: rdfs:label|skos:altLabel
-   text_search: auto
# キーワードからトピックのコレクションを作る（/topic?q=パワーハラスメント|パワハラ。kgraphnavi/topic.py、docs/topic.md。2026.10.26）
#   種の判例 = タームのラベルにキーワードを含む判例（| で区切るといずれか）。リンク = 中心の参照（法令・条）。
#   偏りの大きい条は「主なリンク」（その条だけで入れる）、民法709条のように広く参照される条は「補助リンク」（語と一緒のときだけ確かさを上げる）。
#   ここでは SPARQL だけで作る（下の text_properties・link_properties）。hanrei のパイプラインがあれば、
#   src/topic_keyword.py（略語・派生語への広げ、関連語、本文の語の数）で作る設定を local.yaml に書ける（local.yaml.example）
-   topic:
        item_class: caselawo:CaseLawDocument
        text_properties: ["dcterms:subject/rdfs:label"]
        lang: ja
        link_properties: [caselawp:reflawCore]
        text_search: contains     # 日本語のタームは部分一致で探す（bif:contains は語の区切りが合わない）
        seed_max: 5000
# 少数（2〜4）の判例を列に並べて比べる（/compare?uri=A&uri=B…。kgraphnavi/compare.py。2026.10.26）
#   上訴審・原審（AppealCaseLaw の「審級を並べて比べる」）、保存したコレクション（4件まで）から。古い判決から左に並べる
#   gadget の行は各列にそのガジェットの表、align の行はその変数の値で行をそろえて、どの判例にあるか（違う行を色付け）
-   compare:
        - name: 判例
          title: 判例（審級・結果・争点・参照法令）
          types: [caselawo:CaseLawDocument, caselawo:Judgment, caselawo:Trial]
          sort: |
              select ?k where { graph <http://ds.rois.ac.jp/caselaw/> {
                  $uri caselawp:id ?id . ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?k }}
          rows:
              - gadget: CaseLawInfo
                title: 裁判所・判決日・結果
                columns: [court, judgmentdate, result, caseno, casename]
              - gadget: CaseLawInfo
                title: 判示事項・裁判要旨
                columns: [holding, headnote]
              - gadget: DocIssues
                title: 争点と結論
                columns: [label, outcome, otext]
              - gadget: Legislation
                title: 参照法令（行をそろえる）
                align: legislation
                label: label
                value: status
              - gadget: RefCase
                title: 参照判例（行をそろえる）
                align: ref
                label: reflabel
              - gadget: Keyword
                title: キーワード（行をそろえる）
                align: term
              - gadget: Judge
                title: 裁判官（行をそろえる）
                align: person
                value: role
# 判例の HTML（本文）は /data/<年>/<ID>_hanrei.html で配信する。HTML は IDR（国立情報学研究所 情報学研究データリポジトリ）の
# 「日本の判例HTMLデータ」で提供している（申請が必要。docs/caselaw.md）。手に入れたら、そのフォルダを local.yaml の data_dir
# （またはコマンドラインの --data-dir）に書く。HTML の CSS・中労委の判例の HTML のフォルダも local.yaml に書く（local.yaml.example）
# 探索グラフ（/explore?q=パワハラ。kgraphnavi/explore.py、templates/js/explore.js、docs/explore.md。2026.11.9）
#   種（語・判例・条など）から、ノードをクリックして関係ごとに広げる。形 = 種類、色・大きさ = 画面で切り替える。
#   たどった手順は URL の #s=… に入り、読み直す・共有すると同じ図を作り直す。図の判例は名前を付けて保存できる。
#   関係の問い合わせは $uri から ?n（1つの ?n に1行）を返す。?conf は辺の確かさ（weak の値は破線）。
#   ノードの名前・年・属性（?a_<名前>）・全体の件数（?count）は、種類の info でまとめて調べる（$nodes = VALUES ?n {…}）
-   explore:
        title: 探索グラフ
        describe: 語・判例・条などを種に、関係をたどって判例を集めます。形は種類、色と大きさは右上で切り替えます。
        limit: 30
        max_nodes: 400
        save_kind: 判例
        save_class: caselawo:CaseLawDocument
        attrs:
            - {name: procedure, label: 手続}
            - {name: instance, label: 審級}
            - {name: result, label: 裁判の結果}
            - {name: court, label: 裁判所}
        kinds:
            - name: 判例
              types: [caselawo:CaseLawDocument]
              shape: ellipse
              color: "#0072B2"
              info: |
                  SELECT ?n (SAMPLE(?l) AS ?label) (SAMPLE(?y) AS ?year) (SAMPLE(?r) AS ?a_result) (SAMPLE(?i) AS ?a_instance)
                         (SAMPLE(?c) AS ?a_court) (SAMPLE(?p) AS ?a_procedure)
                  WHERE {
                      $nodes
                      OPTIONAL { ?n rdfs:label ?l }
                      OPTIONAL { ?n caselawp:year ?y }
                      OPTIONAL { ?n caselawp:id ?id . ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:disposition ?d .
                                 BIND(STRAFTER(STR(?d), "/ontology/") AS ?r) }
                      OPTIONAL { ?n caselawp:instance ?inst . ?inst rdfs:label ?i }
                      OPTIONAL { ?n caselawp:id ?id2 . ?t a caselawo:Trial ; caselawp:id ?id2 ; caselawp:court ?ct .
                                 BIND(STRAFTER(STR(?ct), "/ontology/") AS ?c) }
                      OPTIONAL { ?n caselawp:procedure ?pr . ?pr skos:broader* ?top . ?top skos:topConceptOf caselawo:手続体系 ;
                                 rdfs:label ?p }
                  } GROUP BY ?n
            - name: 語
              types: [caselawo:Term]
              shape: tag
              color: "#E69F00"
              info: |
                  SELECT ?n (SAMPLE(?l) AS ?label) (COUNT(DISTINCT ?d) AS ?count) WHERE {
                      $nodes
                      OPTIONAL { ?n rdfs:label ?l }
                      OPTIONAL { ?d caselawp:論点キーワード|caselawp:事案キーワード ?n }
                  } GROUP BY ?n
            - name: 条
              types: [lawo:Clause]
              shape: round-rectangle
              color: "#009E73"
              info: |
                  SELECT ?n (SAMPLE(?l) AS ?label) (COUNT(DISTINCT ?d) AS ?count) WHERE {
                      $nodes
                      OPTIONAL { ?n rdfs:label ?l }
                      OPTIONAL { ?d caselawp:reflawCore ?n }
                  } GROUP BY ?n
            - name: 論点
              types: [caselawo:LegalIssue]
              shape: diamond
              color: "#CC79A7"
              info: |
                  SELECT ?n (SAMPLE(?l) AS ?label) (COUNT(DISTINCT ?d) AS ?count) WHERE {
                      $nodes
                      OPTIONAL { ?n rdfs:label ?l }
                      OPTIONAL { ?d caselawp:legalIssue ?n }
                  } GROUP BY ?n
            - name: トピック
              types: [caselawo:Topic]
              shape: hexagon
              color: "#D55E00"
              info: |
                  SELECT ?n (SAMPLE(?l) AS ?label) (COUNT(DISTINCT ?d) AS ?count) WHERE {
                      $nodes
                      OPTIONAL { ?n rdfs:label ?l }
                      OPTIONAL { ?d caselawp:topicCore ?n }
                  } GROUP BY ?n
            - name: 分野
              types: [caselawo:LegalField]
              shape: barrel
              color: "#56B4E9"
              info: |
                  SELECT ?n (SAMPLE(?l) AS ?label) (COUNT(DISTINCT ?d) AS ?count) WHERE {
                      $nodes
                      OPTIONAL { ?n rdfs:label ?l }
                      OPTIONAL { ?d caselawp:legalfield|caselawp:legalfieldByRule ?n }
                  } GROUP BY ?n
            - name: 人
              types: [caselawo:Person]
              shape: triangle
              color: "#7A5195"
              info: |
                  SELECT ?n (SAMPLE(?l) AS ?label) (COUNT(DISTINCT ?t) AS ?count) WHERE {
                      $nodes
                      OPTIONAL { ?n rdfs:label ?l }
                      OPTIONAL { ?t caselawp:judge/caselawp:person ?n }
                  } GROUP BY ?n
        relations:
            # ---- 判例から ----
            - name: doc_keyword
              label: キーワード（論点・事案）
              from: 判例
              to: 語
              query: |
                  SELECT ?n (SAMPLE(?k) AS ?conf) WHERE {
                      { $uri caselawp:論点キーワード ?n . BIND("論点" AS ?k) }
                      UNION { $uri caselawp:事案キーワード ?n . BIND("事案" AS ?k) }
                  } GROUP BY ?n ORDER BY ?conf
            - name: doc_clause
              label: 判断の中で参照している条
              from: 判例
              to: 条
              query: |
                  SELECT DISTINCT ?n WHERE {
                      $uri caselawp:reflawCore ?n . ?n a lawo:Clause .
                      FILTER(!CONTAINS(STRAFTER(STR(?n), "_"), "_"))
                  }
            - name: doc_issue
              label: 法的論点
              from: 判例
              to: 論点
              weak: [中（候補）]
              query: |
                  SELECT ?n (IF(MIN(?o) = 0, "強", "中（候補）") AS ?conf) (MIN(?o) AS ?ord) WHERE {
                      { $uri caselawp:legalIssue ?n . BIND(0 AS ?o) }
                      UNION { $uri caselawp:legalIssueCandidate ?n . BIND(1 AS ?o) }
                  } GROUP BY ?n ORDER BY ?ord
            - name: doc_topic
              label: トピック
              from: 判例
              to: トピック
              weak: [弱]
              query: |
                  SELECT ?n (IF(MIN(?o) = 0, "強・中", "弱") AS ?conf) (MIN(?o) AS ?ord) WHERE {
                      { $uri caselawp:topicCore ?n . BIND(0 AS ?o) }
                      UNION { $uri caselawp:topic ?n . BIND(1 AS ?o) }
                  } GROUP BY ?n ORDER BY ?ord
            - name: doc_field
              label: 分野
              from: 判例
              to: 分野
              weak: [トピックから]
              query: |
                  SELECT ?n (IF(MIN(?o) = 0, "人手", IF(MIN(?o) = 1, "規則", "トピックから")) AS ?conf) (MIN(?o) AS ?ord) WHERE {
                      { $uri caselawp:legalfield ?n . BIND(0 AS ?o) }
                      UNION { $uri caselawp:legalfieldByRule ?n . BIND(1 AS ?o) }
                      UNION { $uri caselawp:legalfieldByTopic ?n . BIND(2 AS ?o) }
                  } GROUP BY ?n ORDER BY ?ord
            - name: doc_cites
              label: 参照している判例
              from: 判例
              to: 判例
              query: |
                  SELECT DISTINCT ?n ?year WHERE { $uri caselawp:citedcaselaw ?n . OPTIONAL { ?n caselawp:year ?year } }
                  ORDER BY DESC(?year)
            - name: doc_citedby
              label: 参照されている判例
              from: 判例
              to: 判例
              direction: in
              query: |
                  SELECT DISTINCT ?n ?year WHERE { ?n caselawp:citedcaselaw $uri . OPTIONAL { ?n caselawp:year ?year } }
                  ORDER BY DESC(?year)
            - name: doc_appeal
              label: 原審・上訴審
              from: 判例
              to: 判例
              directed: false
              query: |
                  SELECT DISTINCT ?n ?conf WHERE {
                      $uri caselawp:id ?id . ?t a caselawo:Trial ; caselawp:id ?id .
                      { ?t caselawp:原審判例 ?t2 . BIND("原審" AS ?conf) } UNION { ?t caselawp:上訴審判例 ?t2 . BIND("上訴審" AS ?conf) }
                      ?t2 caselawp:id ?id2 . ?n a caselawo:CaseLawDocument ; caselawp:id ?id2 .
                  }
            - name: doc_similar
              label: 類似判例
              from: 判例
              to: 判例
              directed: false
              query: |
                  SELECT ?n (MIN(?r) AS ?rank) WHERE { $uri caselawp:similar ?s . ?s caselawp:similarDocument ?n ; caselawp:rank ?r . }
                  GROUP BY ?n ORDER BY ?rank
            - name: doc_judge
              label: 裁判官
              from: 判例
              to: 人
              query: |
                  SELECT DISTINCT ?n WHERE {
                      $uri caselawp:id ?id . ?t a caselawo:Trial ; caselawp:id ?id ; caselawp:judge/caselawp:person ?n .
                  }
            # ---- 語から ----
            # Virtuoso は「skos:broader* と UNION の中の BIND」「skos:broader* と IF(MIN(…))」の組み合わせで
            # 内部エラー（SQ156 unknown table for a column / Bad dfe）になるので、FILTER(?p IN …) と BIND(IF(?p = …)) で書く（2026.11.9）
            - name: term_doc
              label: この語（下位の語を含む）をキーワードに持つ判例
              from: 語
              to: 判例
              direction: in
              query: |
                  SELECT ?n (SAMPLE(?k) AS ?conf) (SAMPLE(?y) AS ?year) WHERE {
                      ?term skos:broader* $uri .
                      ?n ?p ?term . FILTER(?p IN (caselawp:論点キーワード, caselawp:事案キーワード))
                      BIND(IF(?p = caselawp:論点キーワード, "論点", "事案") AS ?k)
                      OPTIONAL { ?n caselawp:year ?y }
                  } GROUP BY ?n ORDER BY DESC(?year)
            - name: term_related
              label: 上位・下位・関連の語
              from: 語
              to: 語
              directed: false
              query: |
                  SELECT ?n (SAMPLE(?k) AS ?conf) WHERE {
                      { $uri skos:broader ?n . BIND("上位" AS ?k) } UNION { ?n skos:broader $uri . BIND("下位" AS ?k) }
                      UNION { $uri skos:related ?n . BIND("関連" AS ?k) } UNION { ?n skos:related $uri . BIND("関連" AS ?k) }
                  } GROUP BY ?n
            # ---- 条から ----
            - name: clause_doc
              label: この条を判断の中で参照する判例
              from: 条
              to: 判例
              direction: in
              query: |
                  SELECT DISTINCT ?n ?year WHERE { ?n caselawp:reflawCore $uri . OPTIONAL { ?n caselawp:year ?year } }
                  ORDER BY DESC(?year)
            - name: clause_issue
              label: この条に結んだ法的論点
              from: 条
              to: 論点
              direction: in
              query: |
                  SELECT DISTINCT ?n WHERE { ?n caselawp:issueClause $uri }
            - name: clause_topic
              label: この条で定めたトピック
              from: 条
              to: トピック
              direction: in
              weak: [補助]
              query: |
                  SELECT ?n (IF(MIN(?o) = 0, "主", "補助") AS ?conf) (MIN(?o) AS ?ord) WHERE {
                      { ?n caselawp:topicClause $uri . BIND(0 AS ?o) } UNION { ?n caselawp:topicAuxClause $uri . BIND(1 AS ?o) }
                  } GROUP BY ?n ORDER BY ?ord
            # ---- 論点から ----
            - name: issue_doc
              label: この論点（下位を含む）の判例
              from: 論点
              to: 判例
              direction: in
              weak: [中（候補）]
              query: |
                  SELECT ?n (MIN(?o) AS ?ord) (MAX(?k) AS ?conf) (SAMPLE(?y) AS ?year) WHERE {
                      ?f skos:broader* $uri .
                      ?n ?p ?f . FILTER(?p IN (caselawp:legalIssue, caselawp:legalIssueCandidate))
                      BIND(IF(?p = caselawp:legalIssue, 0, 1) AS ?o)
                      BIND(IF(?p = caselawp:legalIssue, "強", "中（候補）") AS ?k)
                      OPTIONAL { ?n caselawp:year ?y }
                  } GROUP BY ?n ORDER BY ?ord DESC(?year)
            - name: issue_tree
              label: 上位・下位の論点
              from: 論点
              to: 論点
              directed: false
              query: |
                  SELECT ?n (SAMPLE(?k) AS ?conf) WHERE {
                      { $uri skos:broader ?n . BIND("上位" AS ?k) } UNION { ?n skos:broader $uri . BIND("下位" AS ?k) }
                  } GROUP BY ?n
            - name: issue_clause
              label: 論点の条
              from: 論点
              to: 条
              query: |
                  SELECT DISTINCT ?n WHERE { $uri caselawp:issueClause ?n }
            # ---- トピックから ----
            - name: topic_doc
              label: このトピックの判例
              from: トピック
              to: 判例
              direction: in
              weak: [弱]
              query: |
                  SELECT ?n (IF(MIN(?o) = 0, "強・中", "弱") AS ?conf) (MIN(?o) AS ?ord) (SAMPLE(?y) AS ?year) WHERE {
                      { ?n caselawp:topicCore $uri . BIND(0 AS ?o) } UNION { ?n caselawp:topic $uri . BIND(1 AS ?o) }
                      OPTIONAL { ?n caselawp:year ?y }
                  } GROUP BY ?n ORDER BY ?ord DESC(?year)
            - name: topic_clause
              label: トピックを定める条
              from: トピック
              to: 条
              weak: [補助]
              query: |
                  SELECT ?n (IF(MIN(?o) = 0, "主", "補助") AS ?conf) (MIN(?o) AS ?ord) WHERE {
                      { $uri caselawp:topicClause ?n . BIND(0 AS ?o) } UNION { $uri caselawp:topicAuxClause ?n . BIND(1 AS ?o) }
                  } GROUP BY ?n ORDER BY ?ord
            - name: topic_axis
              label: トピックの軸（論点・分野）
              from: トピック
              to: 論点
              query: |
                  SELECT DISTINCT ?n WHERE { $uri caselawp:topicAxis ?n . ?n a caselawo:LegalIssue }
            # ---- 分野から ----
            - name: field_doc
              label: この分野の判例
              from: 分野
              to: 判例
              direction: in
              weak: [規則]
              query: |
                  SELECT ?n (IF(MIN(?o) = 0, "人手", "規則") AS ?conf) (MIN(?o) AS ?ord) (SAMPLE(?y) AS ?year) WHERE {
                      { ?n caselawp:legalfield $uri . BIND(0 AS ?o) } UNION { ?n caselawp:legalfieldByRule $uri . BIND(1 AS ?o) }
                      OPTIONAL { ?n caselawp:year ?y }
                  } GROUP BY ?n ORDER BY ?ord DESC(?year)
            - name: field_tree
              label: 上位・下位の分野
              from: 分野
              to: 分野
              directed: false
              query: |
                  SELECT ?n (SAMPLE(?k) AS ?conf) WHERE {
                      { $uri skos:broader ?n . BIND("上位" AS ?k) } UNION { ?n skos:broader $uri . BIND("下位" AS ?k) }
                  } GROUP BY ?n
            # ---- 人から ----
            - name: person_doc
              label: この人が裁判官の判例
              from: 人
              to: 判例
              direction: in
              query: |
                  SELECT DISTINCT ?n ?year WHERE {
                      ?t caselawp:judge/caselawp:person $uri ; caselawp:id ?id .
                      ?n a caselawo:CaseLawDocument ; caselawp:id ?id . OPTIONAL { ?n caselawp:year ?year }
                  } ORDER BY DESC(?year)
-   prefixes:
        caselawo: "http://ds.rois.ac.jp/caselaw/ontology/"
        caselawp: "http://ds.rois.ac.jp/caselaw/property/"
        dcterms: "http://purl.org/dc/terms/"
        dct: "http://purl.org/dc/terms/"
        dc: "http://purl.org/dc/elements/1.1/"
        foaf: "http://xmlns.com/foaf/0.1/"
        lawp: "http://lod4all.net/law/property/"
        lawo: "http://lod4all.net/law/ontology/"        # 以下4つは法令データ(~/nii/law)の条文・定義規定(2026.10.20)
        oa: "http://www.w3.org/ns/oa#"
        cnt: "http://www.w3.org/2011/content#"
        doco: "http://purl.org/spar/doco/"
        prism: "http://prismstandard.org/namespaces/basic/2.0/"
        skos: "http://www.w3.org/2004/02/skos/core#"
        time: "http://www.w3.org/2006/time#"
        qudt: "http://qudt.org/schema/qudt/"
        churoio: "http://ds.rois.ac.jp/churoi/ontology/"
        churoip: "http://ds.rois.ac.jp/churoi/property/"
-   sample:
        # トップ画面。見出しごとのまとまり（2026.11.8 整理）
        sections:
            -   title: 判例を探す
                describe: 判決文書・裁判の一覧（ファセットで絞り込み）と、語での検索
                collection:
                    - CaseLawDocuments,判決文書
                    - Trials,裁判
                    - http://ds.rois.ac.jp/caselaw/ontology/Case,事件
                search:
                    - 宮川美津子
            -   title: 判例の例
                describe: 判例のページで見られるもの（原審・上告審、量刑、通称・記事など）
                resource:
                    - http://ds.rois.ac.jp/caselaw/resource/D020518,休職処分取消事件
                    - http://ds.rois.ac.jp/caselaw/resource/D091345,首都圏建設アスベスト神奈川訴訟（第２陣）控訴審 — 原審・上告審
                    - http://ds.rois.ac.jp/caselaw/resource/D091418,特許権侵害差止等請求控訴事件（知財高裁） — 原審・上告審
                    - http://ds.rois.ac.jp/caselaw/resource/D092738,公職選挙法違反被告事件（大阪高裁） — 原審・上告審
                    - http://ds.rois.ac.jp/caselaw/resource/D022174,刑事事件（被告人複数） — 量刑
                    - http://ds.rois.ac.jp/caselaw/resource/D085620,漁業協同組合の理事会の議決 — 論点・事案キーワード
                    - http://ds.rois.ac.jp/caselaw/resource/C昭和62あ1351,ロッキード事件 — 事件番号
                    - http://ds.rois.ac.jp/caselaw/resource/C平成7合わ141,地下鉄サリン事件 — 事件番号・通称・記事
            -   title: 分類から探す
                describe: 分野（事実・社会問題）・法的論点・手続の3つの軸と、トピック
                resource:
                    - http://ds.rois.ac.jp/caselaw/ontology/分野_労働・職場,分野「労働・職場」
                    - http://ds.rois.ac.jp/caselaw/ontology/論点_労働法,法的論点「労働法」
                    - http://ds.rois.ac.jp/caselaw/ontology/手続_行政訴訟,手続「行政訴訟」
                    - http://ds.rois.ac.jp/caselaw/ontology/審級_上告審,審級「上告審」
                    - http://ds.rois.ac.jp/caselaw/ontology/CaseCategory_配チ,事件記号「配チ」（配偶者暴力に関する保護命令事件）
                collection:
                    - Topics,トピック（条・法令と概念の語で集めた判例）
            -   title: 分析する
                describe: 判例を横断して比べる・数える
                collection:
                    - PrecedentChanges,判例変更（大法廷の判決と変更された判例）
                    - IssueNames,争点の名前（「損害額」「消滅時効の成否」など、同じ争点の判例を並べる）
                    - SeparateOpinions,個別意見（裁判官ごとの順位表）
                resource:
                    - http://ds.rois.ac.jp/caselaw/resource/Topic_進歩性,トピック「特許の進歩性」
            -   title: 人・組織・法令・用語
                describe: 裁判官・当事者、判例が参照する法令の条、判例と法令の用語
                resource:
                    - http://ds.rois.ac.jp/caselaw/resource/尾島明,尾島明（裁判官）
                    - http://ds.rois.ac.jp/caselaw/resource/平木正洋,平木正洋（裁判官）
                    - http://ds.rois.ac.jp/caselaw/resource/富士通株式会社,富士通株式会社（当事者）
                    - http://lod4all.net/law/resource/332AC0000000026_70-4,租税特別措置法第七十条の四
                    - http://ds.rois.ac.jp/caselaw/resource/休職,休職（用語。下位の語をキーワードに持つ判例も）
                    - http://ds.rois.ac.jp/caselaw/resource/パロディー写真,パロディー写真（用語）
            -   title: データの品質・試作
                describe: 元データ（PDF）の状況と、作成中の機能
                collection:
                    - PdfStatus,判決文書のPDFの状況
                    - PdfProblems,問題のあるPDF（誤りの種類・作成ツール別）
                    - KeywordCheck,判例のキーワード（論点・事案。試作）
                resource:
                    - http://ds.rois.ac.jp/caselaw/resource/D086645,判示事項の無い判例のキーワード（試作）
                    - http://ds.rois.ac.jp/caselaw/ontology/CaseLawDocument,判決文書（クラス）
                    - http://ds.rois.ac.jp/caselaw/ontology/Case,事件（クラス）
