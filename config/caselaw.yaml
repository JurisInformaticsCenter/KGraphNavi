-   def: gadget
    name: facet_reflaw_core_clause
    # 判断の中で参照している法令の条（reflawCore。法令そのものも値に入るので、順位表では value_class で条に限る）
    get:
        type: facet
        name: reflaw_core_clause
        label: 判断の中で参照している条
        predicate: caselawp:reflawCore
        value_type: iri
        limit: 30
        search: true
    show:
        type: facet
# ---- トピック（2026.10.22。hanrei の src/topics.py、data/csv/topic_def.csv）----
-   def: gadget
    name: DocIssues
    # 判決文書に付く。裁判・判決のページからは caselawp:id で判決文書へたどる（Keyword と同じ）。
    # 本文へ = その争点を判断した最初の段落へ飛ぶリンク（テキストフラグメント #:~:text=。hanrei の src/issues.py）
    title: 争点（判断の有無、本文の判断の箇所、結論、その争点に特有の語。結論は判断の最後の方の言い回しから推定したもので、取消事由はよく当たるが、ほかの争点は結論の文と一緒に見る）
    get:
        type: sparql
        src: |
            # 1行 = 争点 × 特有の語（表示は group_by: issue で争点ごとに1行にまとめ、語はタームのページへのリンクにする。2026.10.23）
            SELECT ?issue ?label ?headnote ?judged ?jump ?outcome ?otext ?t ?tu WHERE {
            {
            SELECT ?issue ?label (SAMPLE(?j) AS ?judged) (SAMPLE(?link) AS ?jump)
                   (SAMPLE(?o2) AS ?outcome) (SAMPLE(?ot) AS ?otext) (SAMPLE(?hn) AS ?headnote) WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument ; caselawp:id ?id ; caselawp:year ?year ; caselawp:issue ?issue .
                ?issue rdfs:label ?label .
                OPTIONAL { ?issue caselawp:judged ?jb }
                BIND(IF(COALESCE(?jb, false), "判断あり", "判断なし") AS ?j)
                OPTIONAL { ?issue caselawp:judgmentStart ?start }
                BIND(IF(BOUND(?start), CONCAT("/data/", STR(?year), "/", STR(?id), "_hanrei.html#:~:text=", REPLACE(ENCODE_FOR_URI(STR(?start)), "-", "%2D")), ?unbound) AS ?link)   # 「-」はテキストフラグメントの区切りなので %2D に
                OPTIONAL { ?issue caselawp:issueOutcome ?o . ?o rdfs:label ?ol .
                           OPTIONAL { ?issue caselawp:issueOutcomeSource ?osrc } }
                # 結論の出どころ（「判決の結果」）はデータの文字列を使う。Virtuoso は問い合わせの中の CONCAT に入れた全角の文字列を化けさせる
                BIND(IF(BOUND(?ol), CONCAT(STR(?ol), IF(BOUND(?osrc), CONCAT(" (", STR(?osrc), ")"), "")), ?unbound) AS ?o2)
                OPTIONAL { ?issue caselawp:issueOutcomeText ?ot }
                OPTIONAL { ?issue caselawp:issueHeadnote ?hn }   # 最高裁の判決: 判示事項の項目（2026.10.23）
            }} GROUP BY ?issue ?label
            }
            OPTIONAL { graph <http://ds.rois.ac.jp/caselaw/> { ?issue caselawp:issueTerm ?t .
                       OPTIONAL { ?tu rdfs:label ?t ; a caselawo:Term } } }
            } ORDER BY STRLEN(STR(?issue)) ?issue
    show:
        type: htable
        group_by: issue
        columns:
            - id: label
              type: literal
              label: 争点
              width: 300
            - id: headnote
              type: literal
              label: 判示事項（最高裁）
              width: 300
            - id: judged
              type: literal
              label: 判断
              width: 70
            - id: jump
              type: directlink
              string: "本文の判断へ"
              label: 本文
              width: 90
            - id: outcome
              type: literal
              label: 結論（規則で推定）
              width: 110
            - id: otext
              type: literal
              label: 結論の文
              width: 360
            - id: tu
              type: link
              string: "?t"
              label: その争点に特有の語（タームのページへ）
              width: 260
-   def: gadget
    name: DocTopics
    title: トピック
    get:
        type: sparql
        src: |
            SELECT ?topic ?label ?core WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument ; caselawp:id ?id ; caselawp:topic ?topic . ?topic rdfs:label ?label .
                OPTIONAL { ?docid caselawp:topicCore ?topic . BIND("強・中" AS ?k) }
                OPTIONAL { ?docid caselawp:topicByCitation ?topic . BIND("引用" AS ?ci) }
                OPTIONAL { ?docid caselawp:topicByAppeal ?topic . BIND("審級" AS ?ap) }
                BIND(IF(BOUND(?ci) || BOUND(?ap), CONCAT("広げた（", COALESCE(?ci, ""), IF(BOUND(?ci) && BOUND(?ap), "・", ""), COALESCE(?ap, ""), "）"), "") AS ?ex)
                BIND(IF(BOUND(?k), "強・中", IF(?ex != "", ?ex, "弱")) AS ?core)
            }}
    show:
        type: htable
        columns:
            - id: topic
              type: link
              string: "?label"
              label: トピック
              width: 260
            - id: core
              type: literal
              label: 確かさ
              width: 80
#   トピック = 条・法令・概念の語・事件名の語の組。判例はそのどれかでトピックに入る（caselawp:topic）。
#   確かさが「強・中」のもの（条と語の両方、事件名、条だけ、語が5回以上）は caselawp:topicCore
-   def: gadget
    name: TopicDefinition
    title: トピックの定め方
    get:
        type: sparql
        src: |
            SELECT ?kind ?value ?label ?word ?wlink WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { $uri caselawp:topicClause ?value . BIND("条" AS ?kind) OPTIONAL { ?value rdfs:label ?label } }
                UNION { $uri caselawp:topicLaw ?value . BIND("法令" AS ?kind) OPTIONAL { ?value rdfs:label ?label } }
                UNION { $uri caselawp:topicWord ?word . BIND("概念の語" AS ?kind)
                        OPTIONAL { ?term rdfs:label ?word ; a caselawo:Term } }
                UNION { $uri caselawp:topicCasenameWord ?word . BIND("事件名の語" AS ?kind)
                        OPTIONAL { ?term rdfs:label ?word ; a caselawo:Term } }
                UNION { $uri caselawp:topicPartyWord ?word . BIND("当事者の語（概念の語と一緒で強）" AS ?kind)
                        OPTIONAL { ?term rdfs:label ?word ; a caselawo:Term } }
                # 語のリンク: その語をラベルに持つターム（リンク用のターム・論点キーワード）があればそのページ、無ければ語での検索
                # （Virtuoso は BIND の中の IF(EXISTS {…}) を受け付けないので、ラベルで突き合わせる）
                BIND(IF(BOUND(?term), CONCAT("/resource?uri=", ENCODE_FOR_URI(STR(?term))),
                        IF(BOUND(?word), CONCAT("/search?q=", ENCODE_FOR_URI(STR(?word)), "&mode=partial"), ?unbound)) AS ?wlink)
            }}
    show:
        type: htable
        columns:
            - id: kind
              type: literal
              label: 種類
              width: 100
            - id: value
              type: link
              string: "?label"
              label: 条・法令
              width: 260
            - id: wlink
              type: directlink
              string: "?word"
              label: 語（タームのページ、無ければ語で検索）
              width: 220
# トピックの階層（skos:broader。下位のトピックの判例は上位のトピックの判例に限る）
-   def: gadget
    name: TopicHierarchy
    title: 上位・下位のトピック
    get:
        type: sparql
        src: |
            SELECT ?rel ?t ?label (COUNT(DISTINCT ?doc) AS ?n) WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { $uri skos:broader ?t . BIND("上位" AS ?rel) BIND(0 AS ?ord) }
                UNION { ?t skos:broader $uri . BIND("下位" AS ?rel) BIND(1 AS ?ord) }
                UNION { $uri skos:broader ?p . ?t skos:broader ?p . FILTER(?t != $uri) BIND("同じ上位の下位" AS ?rel) BIND(2 AS ?ord) }
                ?t rdfs:label ?label .
                OPTIONAL { ?doc caselawp:topicCore ?t }
            }} GROUP BY ?ord ?rel ?t ?label ORDER BY ?ord ?label
    show:
        type: htable
        columns:
            - id: rel
              type: literal
              label: 関係
              width: 120
            - id: t
              type: link
              string: "?label"
              label: トピック
              width: 260
            - id: n
              type: literal
              label: 判例（強・中）
              width: 100
-   def: gadget
    name: CaseLawInThisTopic
    title: このトピックの判例（確かさ 強・中、引用・審級で広げたもの、弱 の順。その中は新しい順）
    collection:
        class: caselawo:CaseLawDocument
        facet: topic
        label: このトピックの判決文書をコレクションとして表示（ほかの絞り込みと組み合わせられる）
    get:
        type: sparql
        page_size: 50
        src: |
            SELECT ?doc ?label ?date ?how ?core WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?doc caselawp:topic $uri ; rdfs:label ?label .
                OPTIONAL { ?doc caselawp:topicByLaw $uri . BIND("条" AS ?l) }
                OPTIONAL { ?doc caselawp:topicByWord $uri . BIND("語" AS ?w) }
                OPTIONAL { ?doc caselawp:topicByCasename $uri . BIND("事件名" AS ?c) }
                OPTIONAL { ?doc caselawp:topicByParty $uri . BIND("・当事者" AS ?pt) }
                OPTIONAL { ?doc caselawp:topicByCitation $uri . BIND("引用" AS ?ci) }
                OPTIONAL { ?doc caselawp:topicByAppeal $uri . BIND("審級" AS ?ap) }
                BIND(BOUND(?l) || BOUND(?w) || BOUND(?c) AS ?base)
                OPTIONAL { ?doc caselawp:topicCore $uri . BIND("強・中" AS ?k) }
                BIND(CONCAT(COALESCE(?l, ""), IF(BOUND(?l) && (BOUND(?w) || BOUND(?c)), "・", ""), COALESCE(?w, ""), COALESCE(?pt, ""), IF(BOUND(?w) && BOUND(?c), "・", ""), COALESCE(?c, ""),
                            IF(?base && (BOUND(?ci) || BOUND(?ap)), "（広げた: ", IF(BOUND(?ci) || BOUND(?ap), "広げた: ", "")),
                            COALESCE(?ci, ""), IF(BOUND(?ci) && BOUND(?ap), "・", ""), COALESCE(?ap, ""),
                            IF(?base && (BOUND(?ci) || BOUND(?ap)), "）", "")) AS ?how)
                BIND(IF(BOUND(?k), "強・中", IF(BOUND(?ci) || BOUND(?ap), "広げた", "弱")) AS ?core)
                BIND(IF(BOUND(?k), 0, IF(BOUND(?ci) || BOUND(?ap), 1, 2)) AS ?ord)
                OPTIONAL { ?doc caselawp:id ?id . ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?date }
            }} ORDER BY ?ord DESC(?date)
    show:
        type: htable
        columns:
            - id: doc
              type: link
              string: "?label"
              label: このトピックの判例
              width: 320
            - id: how
              type: literal
              label: 手がかり
              width: 160
            - id: core
              type: literal
              label: 確かさ
              width: 60
            - id: date
              type: literal
              label: 判決日
              width: 100
-   def: page
    name: Topics
    type: collection
    class: caselawo:Topic
    tabs:
        - label: 一覧
          gadget:
            - TopicList
-   def: gadget
    name: TopicList
    title: トピック
    get:
        type: sparql
        src: |
            # 上位のトピックの下に下位のトピックが並ぶように、上位の名前・上位か下位か・名前の順に並べる
            SELECT ?entity ?label ?parent ?plabel ?ncore ?nall WHERE {
              { SELECT ?entity (COUNT(DISTINCT ?core) AS ?ncore) WHERE {
                  $collection
                  OPTIONAL { ?core caselawp:topicCore ?entity } } GROUP BY ?entity }
              { SELECT ?entity (COUNT(DISTINCT ?doc) AS ?nall) WHERE {
                  $collection
                  OPTIONAL { ?doc caselawp:topic ?entity } } GROUP BY ?entity }
              ?entity rdfs:label ?label .
              OPTIONAL { ?entity skos:broader ?parent . ?parent rdfs:label ?plabel }
            } ORDER BY COALESCE(?plabel, ?label) BOUND(?parent) ?label
    show:
        type: htable
        columns:
            - id: entity
              type: link
              string: "?label"
              label: トピック
              width: 260
            - id: parent
              type: link
              string: "?plabel"
              label: 上位のトピック
              width: 160
            - id: ncore
              type: literal
              label: 判例（強・中）
              width: 100
            - id: nall
              type: literal
              label: 判例（弱を含む）
              width: 100
