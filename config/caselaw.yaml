# 判例のキーワードを一覧で確かめる（hanrei の src/keywords.py の keywords.ttl。2026.10.16 試作）
-   def: page
    name: KeywordCheck
    type: collection
    query: |
        SELECT DISTINCT ?uri
        WHERE {
            ?uri a caselawo:CaseLawDocument ;
                 caselawp:論点キーワード|caselawp:事案キーワード ?kw .
        }
    sidebar:
        - facet_year
    tabs:
        - label: 一覧
          gadget:
            - KeywordList
-   def: gadget
    name: KeywordList
    title: 判例のキーワード（論点・事案）
    get:
        type: sparql
        page_size: 50
        src: |
            SELECT ?entity ?id ?casename (GROUP_CONCAT(DISTINCT ?il; separator=", ") AS ?issue)
                   (GROUP_CONCAT(DISTINCT ?fl; separator=", ") AS ?fact)
            WHERE {
                $collection
                ?entity caselawp:id ?id .
                OPTIONAL { ?entity caselawp:論点キーワード ?i . ?i rdfs:label ?il }
                OPTIONAL { ?entity caselawp:事案キーワード ?f . ?f rdfs:label ?fl }
                OPTIONAL { ?t a caselawo:Trial ; caselawp:id ?id ; caselawp:casename ?casename }
            }
            GROUP BY ?entity ?id ?casename
            ORDER BY ?id
    show:
        type: htable
        columns:
            - id: entity
              type: link
              string: "?id"
              label: ID
              width: 70
            - id: casename
              label: 事件名
              width: 200
            - id: issue
              label: 論点キーワード
              width: 300
            - id: fact
              label: 事案キーワード
              width: 300
