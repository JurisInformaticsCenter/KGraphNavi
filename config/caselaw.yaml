-   def: gadget
    name: CaseLawInfo
    height: 700
    get:
        type: sparql
        src: |
            select ?caseno ?casenumber ?casename ?casecategory ?casecategorylabel ?holding ?headnote ?court ?judgmentdate ?result ?appealfiling ?upper ?caselawid ?ecli ?cltkey ?field ?source ?sourcelabel ?pdf ?html ?id ?year ?npages where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?trialid a caselawo:Trial; caselawp:id ?id .
                ?judgmentid a caselawo:Judgment; caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                ?docid caselawp:year ?year .
                OPTIONAL {?trialid caselawp:caseno ?caseno}
                OPTIONAL {?trialid caselawp:case ?case . ?case caselawp:casenumber ?casenumber}
                OPTIONAL {?trialid caselawp:casename ?casename}
                OPTIONAL {?trialid caselawp:casecategory ?casecategory. ?casecategory rdfs:label ?casecategorylabel}
                OPTIONAL {?judgmentid caselawp:判示事項 ?holding}
                OPTIONAL {?judgmentid caselawp:裁判要旨 ?headnote}
                OPTIONAL {?trialid caselawp:court ?court}
                OPTIONAL {?judgmentid caselawp:judgmentdate ?judgmentdate}
                OPTIONAL {?judgmentid caselawp:disposition ?result}
                # 上告審の結果（下級審の判例。「上告棄却（決定）（2006-01-10）、上告不受理（2006-01-20）」。2026.11.10）
                OPTIONAL {?trialid caselawp:上告提起等の有無 ?appealfiling}
                # 判例ID（ECLI 形式）と判例キー（hanrei の src/caseid.py・caseidlink.py。2026.11.10）
                OPTIONAL {?judgmentid caselawp:caseLawId ?caselawid . ?caselawid rdfs:label ?ecli}
                OPTIONAL {?judgmentid caselawp:caseLawKey ?cltkey}
                OPTIONAL {
                    SELECT ?id (GROUP_CONCAT(?u; separator="、") AS ?upper) WHERE {
                        ?t2 a caselawo:Trial ; caselawp:id ?id ; caselawp:upperCourtOutcome ?o .
                        ?o caselawp:outcome ?oc ; caselawp:outcomeDate ?od .
                        ?oc rdfs:label ?ol .
                        BIND(CONCAT(STR(?ol), "（", STR(?od), "）") AS ?u)
                    } GROUP BY ?id
                }
                OPTIONAL {?trialid caselawp:分野 ?field}
                OPTIONAL {?docid foaf:primaryTopic ?pdf}
                OPTIONAL {?docid dcterms:extent ?npages}
                OPTIONAL {?docid dcterms:source ?source . OPTIONAL {?source rdfs:label ?sourcelabel}}
                # HTML文書（/data/…）。中労委は /data/churoi/<ID>.html（設定の data_dirs）、それ以外は /data/<年>/<ID>_hanrei.html。PDFの無い文書には無い
                OPTIONAL {
                    ?docid foaf:primaryTopic ?pdf2 ;
                           caselawp:id ?id2 ;
                           caselawp:year ?year2 .
                    OPTIONAL {?docid dcterms:source ?source2}
                    BIND(IF(COALESCE(?source2 = <http://ds.rois.ac.jp/caselaw/resource/Source_churoi>, false),
                            CONCAT("/data/churoi/", STR(?id2), ".html"),
                            CONCAT("/data/", STR(?year2), "/", STR(?id2), "_hanrei.html")) AS ?html)
                }
            }}
    show: 
        type: vtable
        # 属性名の列の幅（2026.10.18）
        attribute_width: 110
        columns:
            - id: caseno
              label: 事件番号
              # 事件番号のページへ(同じ事件番号の裁判・この事件番号を参照している判例。2026.10.18)
              link: casenumber
              width: 100
            - id: casename
              label: 事件名
            - id: casecategorylabel
              label: 事件区分
              # その事件区分の裁判のコレクションへ
              collection:
                  class: caselawo:Trial
                  facet: trial_case_category
                  value: casecategory
            - id: holding
              label: 判示事項
            - id: headnote
              label: 裁判要旨
            - id: court
              label: 裁判所
              display: localname
              # その裁判所の裁判のコレクションへ
              collection:
                  class: caselawo:Trial
                  facet: trial_court
            - id: judgmentdate
              label: 判決言い渡し日
            - id: result
              label: 結果/判決結果
              display: localname
            - id: appealfiling
              label: 上告提起等
              display: localname
            - id: upper
              label: 上告審の結果
            - id: ecli
              label: 判例ID
              # 判例IDのページへ（この判例を引用している判例・原審としている判例。データに無い判決への引用も）
              link: caselawid
            - id: cltkey
              label: 判例キー
            - id: field
              label: 分野
              display: localname
            - id: sourcelabel
              label: 出典
              link: source
            - id: id
              label: ID
            - id: pdf
              label: 判例PDF文書URI
              type: directlink
            - id: npages
              label: PDFページ数
            - id: html
              label: HTML文書
              type: directlink
              string: "HTML文書"
-   def: gadget
