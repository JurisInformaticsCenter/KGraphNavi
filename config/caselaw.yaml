# ---------------------------------------------------------------- 出典（2026.10.6）
#   判例文書 dcterms:source caselaw:Source_courts（裁判所）/ caselaw:Source_churoi（中労委）
-   def: gadget
    name: facet_source
    get:
        type: facet
        name: source
        label: 出典
        predicate: dcterms:source
        value_type: iri
        limit: 10
    show:
