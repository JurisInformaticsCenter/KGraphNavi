              width: 160
-   def: gadget
    name: LawTermDefinition
    # 語のページで共通。同じラベルの法令の語（law:<語>。定義語・特徴語・条見出し）について（2026.11.5）
    focus: '$uri rdfs:label ?l . ?new rdfs:label ?l . VALUES ?t { lawo:Term lawo:Keyword skos:Concept } ?new a ?t . FILTER(STRSTARTS(STR(?new), "http://lod4all.net/law/resource/"))'
    title: この語を定義している法令の規定
    # 法令の定義規定（defword.ttl の lawo:Definition）と、その定義を使っている箇所の数（refterm.ttl の lawo:ReferTerm）。
    # 同じ語でも法令ごとに意味が違うので、法令・条項ごとに出す
    get:
        type: sparql
        src: |
            # 条項のラベルは「会社法2条第1項」（判例のデータ）と「会社法第二条第一項」（法令のデータ）の2つがあるので、
            # 定義・条項ごとに1行にする（MIN で算用数字のほう。2026.11.5）
            select ?body ?clause (MIN(STR(?cl)) AS ?clauselabel) ?law (MIN(STR(?ll)) AS ?lawlabel) (count(distinct ?ref) as ?nref) where {
                ?b lawp:term $uri ; lawp:body ?body .
                ?def oa:hasBody ?b ; oa:hasTarget ?tgt .
                ?tgt oa:hasSource ?s .
                ?s lawp:clause ?clause ; lawp:law ?law .
                OPTIONAL {?clause rdfs:label ?cl . FILTER (CONTAINS(STR(?cl), "第"))}
                OPTIONAL {?law rdfs:label ?ll}
                OPTIONAL {?ref a lawo:ReferTerm ; oa:hasBody ?def}
            } group by ?body ?clause ?law
            order by desc(?nref) ?lawlabel ?clause
            limit 200
    show:
        type: htable
        columns:
            - id: lawlabel
              label: 法令
              link: law
              width: 200
            - id: clauselabel
              label: 条項
              link: clause
              width: 160
            - id: body
              label: 定義（2022年10月の版）
              width: 420
            - id: nref
              label: この定義を使う箇所
              width: 80
-   def: gadget
    name: LawTermCaseLaw
    title: 判例のターム
    # 同じ文字列の判例のターム（caselaw:<語>）と、それを含む判決文書の数。判例のタームのページから判例へたどれる
