            } group by ?term
    show:
        type: htable
        columns:
            - id: term
              label: 判例のターム
              type: link
              display: localname
              width: 200
            - id: ndoc
              label: この語を含む判例の数
              width: 120
-   def: gadget
    name: LawTermClause
    # 語のページで共通。同じラベルの法令の語（law:<語>。定義語・特徴語・条見出し）について（2026.11.5）
    focus: '$uri rdfs:label ?l . ?new rdfs:label ?l . VALUES ?t { lawo:Term lawo:Keyword skos:Concept } ?new a ?t . FILTER(STRSTARTS(STR(?new), "http://lod4all.net/law/resource/"))'
    title: この語が特徴的に現れる条
    # 法令の条の特徴語（extracted.ttl の lawo:ExtractedWord。lawp:score の大きい順）
    get:
        type: sparql
        src: |
            # 条のラベルが2つ（算用数字・漢数字）あるので、条ごとに1行（2026.11.5）
            select ?clause (MIN(STR(?cl)) AS ?clauselabel) ?law (MIN(STR(?ll)) AS ?lawlabel) (MAX(?sc) AS ?score) where {
                ?x lawp:word $uri ; lawp:at ?clause ; lawp:score ?sc .
                OPTIONAL {?clause rdfs:label ?cl}
                OPTIONAL {?clause lawp:law ?law . OPTIONAL {?law rdfs:label ?ll}}
            } group by ?clause ?law
            order by desc(?score) limit 100
    show:
        type: htable
        columns:
            - id: lawlabel
              label: 法令
              link: law
              width: 220
            - id: clauselabel
              label: 条
              link: clause
              width: 160
            - id: score
              label: 特徴の強さ
              width: 80
-   def: gadget
    name: Keyword
    # 論点キーワード・事案キーワード（hanrei の src/keywords.py の keywords.ttl。2026.10.16 試作）。
    # 判決文書に付く。裁判・判決のページからは caselawp:id で判決文書へたどる
    get:
        type: sparql
        src: |
            select ?kind ?term where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                {
                    ?docid caselawp:論点キーワード ?term . BIND("論点" AS ?kind)
                } UNION {
                    ?docid caselawp:事案キーワード ?term . BIND("事案" AS ?kind)
                }
            }} order by desc(?kind) ?term
    show:
        type: htable
        columns:
            - id: kind
              label: 種類
              width: 60
            - id: term
              label: キーワード
              type: link
              display: localname
              width: 250
-   def: gadget
    name: Legislation
    # 参照法令(2026.10.18)。法令・条ごとに1行。旧法令は当時の題名(lawp:historicalTitle)を先に。
    # Virtuoso では、データの文字列と問い合わせに書いた文字列を CONCAT でつなぐと文字化けする(「現行」→「ç¾è¡」)ので、
    # データの値(見出し・状態)と、問い合わせに書いた文字列だけの「注意」の列を分ける。解説のリンクもデータ(lawp:commentary)から
    get:
        type: sparql
        src: |
            select ?legislation (sample(?label0) as ?label) (sample(?caption0) as ?caption) (sample(?status0) as ?status)
                   (sample(?note0) as ?note) (sample(?commentary0) as ?commentary) where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                ?docid caselawp:reflaw ?legislation .
                OPTIONAL{?legislation rdfs:label ?l}
                OPTIONAL{?legislation lawp:historicalTitle ?ht}
                BIND (COALESCE(?ht, ?l) AS ?label0)
                OPTIONAL{?legislation lawp:law ?law0}
                BIND (COALESCE(?law0, ?legislation) AS ?law)
                OPTIONAL{?law lawp:del_flg ?del}
                OPTIONAL{?legislation lawp:clauseStatus ?cs}
                OPTIONAL{?law lawp:lastAmendmentDate ?amd}
                OPTIONAL{?law lawp:promulgationDate ?prom}
                OPTIONAL{?jg a caselawo:Judgment; caselawp:id ?id; caselawp:judgmentdate ?jd}
                # 条見出し(src/lawcaption.py。e-Gov)。共通見出しを引き継いだものは「注意」に書く
                OPTIONAL{?legislation lawp:caption ?cap1}
                OPTIONAL{?legislation lawp:commonCaption ?cap2}
                BIND (COALESCE(?cap1, ?cap2) AS ?caption0)
                # 状態: 廃止法令(lawp:del_flg)、条の状態(lawp:clauseStatus。現行/削除/現行に無い条)
                BIND (IF(COALESCE(STR(?del) = "1", false), "廃止法令", ?cs) AS ?status0)
                # 注意(問い合わせに書いた文字列だけ): 判決日が公布日より前(旧法の参照)、判決日より後の法令改正、共通見出し
                BIND (IF(COALESCE(?prom > ?jd, false), "判決時には未公布（旧法の参照）",
                      IF(COALESCE(?amd > ?jd, false),
                         IF(BOUND(?cap2) && !BOUND(?cap1), "判決後に法令改正あり（条は未確認）。見出しは前の条の共通見出し", "判決後に法令改正あり（条は未確認）"),
                         IF(BOUND(?cap2) && !BOUND(?cap1), "見出しは前の条の共通見出し", ?unbound))) AS ?note0)
                OPTIONAL{?legislation lawp:commentary ?commentary0}
            }} group by ?legislation order by ?label
    show:
        type: htable
        # 法令 > 条 > 項 > 号 の階層で表示する(2026.10.18)。親は IRI の末尾の「_…」を外したもの
        # (…_570_1 → …_570 → 法令)。子の名称は親の名称を省く(「民法570条第1項」→「第1項」)。数字は数の大小で並べる
        tree:
            node: legislation
            parent_regex: "_[^_/]*$"
            column: label
            # 親(条)と同じ見出し・解説は、子(項・号)の行では空にする
            same_as_parent: [caption, commentary]
        columns:
            # 法令・条のページへ
            - id: label
              label: 法令名称
              link: legislation
              width: 220
            - id: caption
              label: 見出し
              width: 200
            - id: status
              label: 状態
              width: 90
            - id: note
              label: 注意
              width: 220
            - id: commentary
              display: localname
              label: 解説（Wikibooks）
              type: directlink
              width: 130
# 量刑（hanrei の src/punishment.py の punishment.ttl。2026.11.7 直す）。
# 裁判（caselaw:J…）caselawp:judgment [被告人ごとの主文: caselawp:defendant・caselawp:punishment・caselawp:hasSuspendedSentence・
# caselawp:ancillaryDisposition・caselawp:pretrialDetentionCredit・caselawp:verdict]。判決文書のページからは caselawp:id でたどる。
# 以前は caselawp:punishment を裁判に直接付いたものとして探していたので、何も出なかった
-   def: gadget
    name: Punishment
    title: 量刑（主文）
    get:
        type: sparql
        src: |
            # 刑期は数（caselawp:termMonths・termDays・suspendedMonths・pretrialDays）を使い、表示で「5月」「2年」「110日」にする。
            # Virtuoso では xsd:duration（P5M）の値が単位の無い数になり、5年か5月か分からなかった（2026.11.7）。
            # OPTIONAL は入れ子にせず、BIND で選ぶ（Virtuoso で外の変数を見る OPTIONAL の値が消えることがある）
            select ?defendant ?kind ?kindlabel ?months ?days ?amount ?suspend ?ord where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgment ?jd .
                OPTIONAL { ?jd caselawp:defendant ?defendant }
                {
                    ?jd caselawp:punishment ?p . ?p a ?kind . BIND(0 AS ?ord)
                    OPTIONAL { ?p caselawp:termMonths ?months }
                    OPTIONAL { ?p caselawp:termDays ?days }
                    OPTIONAL { ?p caselawp:amount ?q . ?q qudt:numericValue ?amount }
                    OPTIONAL { ?jd caselawp:suspendedMonths ?s0 }
                    BIND(IF(BOUND(?months), ?s0, ?unbound) AS ?suspend)
                } UNION {
                    # 執行猶予だけ別の文で、まとめて言い渡したもの
                    ?jd caselawp:suspendedMonths ?suspend .
                    FILTER NOT EXISTS { ?jd caselawp:punishment ?p1 }
                    BIND(caselawo:執行猶予 AS ?kind) BIND(3 AS ?ord)
                } UNION {
                    ?jd caselawp:verdict ?kind . BIND(1 AS ?ord)
                } UNION {
                    ?jd caselawp:ancillaryDisposition ?kind . BIND(2 AS ?ord)
                    OPTIONAL { ?jd caselawp:pretrialDays ?c0 }
                    BIND(IF(?kind = caselawo:未決勾留日数算入, ?c0, ?unbound) AS ?days)
                }
            }
                OPTIONAL { ?kind rdfs:label ?kl }
                BIND(COALESCE(?kl, ?kind) AS ?kindlabel)
            } order by ?defendant ?ord ?kindlabel
    show:
        type: htable
        columns:
            - id: defendant
              label: 被告人
              width: 140
            - id: kindlabel
              label: 刑罰・処分
              display: localname
              width: 160
            - id: months
              label: 刑期
              display: months
              width: 90
            - id: days
              label: 日数
              display: days
              width: 80
            - id: amount
              label: 金額
              display: yen
              width: 110
            - id: suspend
              label: 執行猶予
              display: months
              width: 90
