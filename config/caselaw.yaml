-   def: gadget
    name: SentencePosition
    title: 同じ罪名の判決（実刑・刑期の分かるもの。上訴審で破棄されたものを除く）の中での刑期
    # 罪名ごとに、件数・この判決より短い／同じ／長い件数・最短・平均・最長。罪名が複数の判決（併合罪など）も入るので、目安として見る
    get:
        type: sparql
        src: |
            SELECT ?crime ?months (COUNT(DISTINCT ?o) AS ?n) (SUM(IF(?om < ?months, 1, 0)) AS ?shorter)
                   (SUM(IF(?om = ?months, 1, 0)) AS ?same) (SUM(IF(?om > ?months, 1, 0)) AS ?longer)
                   (MIN(?om) AS ?min) (ROUND(AVG(?om)) AS ?avg) (MAX(?om) AS ?max) WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?doc a caselawo:CaseLawDocument ; caselawp:id ?id .
                { ?doc caselawp:sentenceKind ?k . BIND(?doc AS ?s) } UNION { ?doc caselawp:sentenceIn ?s }
                ?s caselawp:sentenceKind caselawo:量刑_実刑 ; caselawp:sentenceMonths ?months ; caselawp:crimeName ?crime .
                ?o caselawp:crimeName ?crime ; caselawp:sentenceKind caselawo:量刑_実刑 ; caselawp:sentenceMonths ?om .
                FILTER NOT EXISTS { ?o caselawp:sentenceStatus caselawo:量刑_上訴審で破棄 }
            }} GROUP BY ?crime ?months ORDER BY DESC(?n)
    show:
        type: htable
        columns:
            - id: crime
              label: 罪名（同じ罪名の判決へ）
              collection:
                  class: caselawo:CaseLawDocument
                  facet: crime_name
              width: 180
            - id: months
              label: この判決の刑期
              display: months
              width: 90
            - id: n
              label: 件数
              width: 60
            - id: shorter
              label: より短い
              width: 70
            - id: same
              label: 同じ
              width: 60
            - id: longer
              label: より長い
              width: 70
            - id: min
              label: 最短
              display: months
              width: 60
            - id: avg
              label: 平均
              display: months
              width: 60
            - id: max
              label: 最長
              display: months
              width: 60
# ---- 判例変更（hanrei の src/precedent.py の precedent_change.ttl。2026.11.7）----
# 大法廷の判決の「…判例は、これを変更すべきものと認める」などの文と、変更された判例（データ中の判例に照合できたもの）
-   def: gadget
    name: PrecedentChange
    title: 判例変更（この判決が変更した判例・この判例を変更した判決）
    get:
        type: sparql
        src: |
            SELECT ?rel ?other ?olabel ?odate ?stmt ?how ?ord WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?doc a caselawo:CaseLawDocument ; caselawp:id ?id .
                {
                    ?doc caselawp:overruledBy ?other . BIND("この判例を変更した判決" AS ?rel) BIND(0 AS ?ord)
                    OPTIONAL { ?other caselawp:precedentChange ?pc . ?pc caselawp:statement ?stmt ; caselawp:how ?how }
                } UNION {
                    ?doc caselawp:precedentChange ?pc . ?pc caselawp:statement ?stmt ; caselawp:how ?how .
                    OPTIONAL { ?doc caselawp:overrules ?other }
                    BIND("この判決が変更した判例" AS ?rel) BIND(1 AS ?ord)
                }
                OPTIONAL { ?other rdfs:label ?olabel }
                OPTIONAL { ?other caselawp:id ?oid . ?oj a caselawo:Judgment ; caselawp:id ?oid ; caselawp:judgmentdate ?odate }
            }} ORDER BY ?ord ?odate
    show:
        type: htable
        columns:
            - id: rel
              type: literal
              label: 関係
              width: 150
            - id: olabel
              label: 判例
              link: other
              width: 240
            - id: odate
              label: 判決日
              width: 90
            - id: stmt
              label: 判例変更の文
              width: 460
            - id: how
              label: 見つけ方
              width: 70
-   def: page
    name: PrecedentChanges
    type: collection
    query: |
        SELECT DISTINCT ?uri
        WHERE {
            ?uri a caselawo:CaseLawDocument ;
                 caselawp:precedentChange ?pc .
        }
    sidebar:
        - facet_year
    tabs:
        - label: 一覧
          gadget:
            - PrecedentChangeList
-   def: gadget
    name: PrecedentChangeList
    title: 判例変更の一覧（新しい順。変更された判例が空なのは、データに無い判例か、事件番号の書かれていないもの）
    get:
        type: sparql
        src: |
            SELECT ?entity ?label ?date ?other ?olabel ?odate ?stmt WHERE {
                $collection
                ?entity caselawp:id ?id ; rdfs:label ?label ; caselawp:precedentChange ?pc .
                ?pc caselawp:statement ?stmt .
                OPTIONAL { ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?date }
                OPTIONAL { ?entity caselawp:overrules ?other . ?other rdfs:label ?olabel .
                           OPTIONAL { ?other caselawp:id ?oid . ?oj a caselawo:Judgment ; caselawp:id ?oid ; caselawp:judgmentdate ?odate } }
            } ORDER BY DESC(?date)
    show:
        type: htable
        group_by: entity
        columns:
            - id: label
              label: 変更した判決（大法廷）
              link: entity
              width: 220
            - id: date
              label: 判決日
              width: 90
            - id: olabel
              label: 変更された判例
              link: other
              width: 220
            - id: odate
              label: その判決日
              width: 90
            - id: stmt
              label: 判例変更の文
              width: 420
# ---- 法的論点（B 軸: 法律上、何が争われたか。hanrei の src/legalissue.py の legalissue.ttl。2026.11.8）----
-   def: gadget
    name: IssueTopics
    title: この論点（下位の論点を含む）のトピック（条・語・事件名の手がかりを詰めて集めた判例）
    get:
        type: sparql
        src: |
            SELECT ?t ?tlabel ?rel ?f ?flabel ?ns ?nm ?ev WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?f skos:broader* $uri .
                ?t caselawp:topicAxis ?f ; rdfs:label ?tlabel .
                ?f rdfs:label ?flabel .
                OPTIONAL { ?t skos:broadMatch ?bm }
                BIND(IF(BOUND(?bm), "下位", "同じ") AS ?rel)
                OPTIONAL { ?t caselawp:topicStrongCount ?ns }
                OPTIONAL { ?t caselawp:topicMiddleCount ?nm }
                OPTIONAL { ?t caselawp:topicEvaluation ?ev }
            }} ORDER BY ?flabel ?tlabel
    show:
        type: htable
        columns:
            - id: t
              type: link
              string: "?tlabel"
              label: トピック
              width: 220
            - id: rel
              type: literal
              label: 範囲
              width: 50
            - id: f
              type: link
              string: "?flabel"
              label: 論点
              width: 220
            - id: ns
              type: literal
              label: 強
              display: number
              width: 60
            - id: nm
              type: literal
              label: 中
              display: number
              width: 60
            - id: ev
              type: literal
              label: 答え合わせ
              width: 200
-   def: gadget
    name: IssueInfo
    title: 法的論点
    get:
        type: sparql
        src: |
            SELECT ?label ?level ?parent ?parentlabel ?clause ?clauselabel ?topic ?topiclabel ?comment WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:label ?label .
                OPTIONAL { $uri skos:notation ?level }
                OPTIONAL { $uri skos:broader ?parent . ?parent rdfs:label ?parentlabel }
                OPTIONAL { $uri skos:relatedMatch ?topic . OPTIONAL { ?topic rdfs:label ?topiclabel } }
                OPTIONAL { $uri rdfs:comment ?comment }
            }
                OPTIONAL { $uri caselawp:issueClause ?clause . OPTIONAL { ?clause rdfs:label ?cl } }
                BIND(COALESCE(?cl, ?clause) AS ?clauselabel)
            }
    show:
        type: htable
        group_by: label
        columns:
            - id: label
              label: 論点
              width: 200
            - id: level
              label: 段
              width: 70
            - id: parentlabel
              label: 上位
              link: parent
              width: 160
            - id: clauselabel
              label: 条（判断の中で参照した条を手がかりにする）
              link: clause
              width: 220
            - id: topiclabel
              label: トピック
              link: topic
              width: 140
            - id: comment
              label: メモ
              width: 200
-   def: gadget
    name: IssueHierarchy
    title: 上位・下位の論点
    get:
        type: sparql
        src: |
            SELECT ?rel ?f ?label (COUNT(DISTINCT ?doc) AS ?n) (COUNT(DISTINCT ?cand) AS ?nc) WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { $uri skos:broader ?f . BIND("上位" AS ?rel) BIND(0 AS ?ord) }
                UNION { ?f skos:broader $uri . BIND("下位" AS ?rel) BIND(1 AS ?ord) }
                UNION { $uri skos:broader ?p . ?f skos:broader ?p . FILTER(?f != $uri) BIND("同じ上位の論点" AS ?rel) BIND(2 AS ?ord) }
                ?f rdfs:label ?label .
                OPTIONAL { ?sub skos:broader* ?f . ?doc caselawp:legalIssue ?sub }
                OPTIONAL { ?sub2 skos:broader* ?f . ?cand caselawp:legalIssueCandidate ?sub2 }
            }} GROUP BY ?ord ?rel ?f ?label ORDER BY ?ord ?label
    show:
        type: htable
        columns:
            - id: rel
              type: literal
              label: 関係
              width: 120
            - id: f
              type: link
              string: "?label"
              label: 論点
              width: 280
            - id: n
              type: literal
              label: 判例（強）
              width: 80
            - id: nc
              type: literal
              label: 候補（中）
              width: 80
-   def: gadget
    name: CaseLawWithThisIssue
    title: この論点（下位の論点を含む）の判例（確かさ 強、候補 中 の順。その中は新しい順）
    collection:
        title: この論点の判決文書
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        page_size: 50
        src: |
            # 強 = 判断の中で参照した条と論点キーワードの両方、またはトピック。中（候補）= 条だけ、または語だけ
            SELECT ?doc ?label ?f ?flabel ?conf ?date WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?f skos:broader* $uri .
                { ?doc caselawp:legalIssue ?f . BIND("強" AS ?conf) BIND(0 AS ?ord) }
                UNION { ?doc caselawp:legalIssueCandidate ?f . BIND("中（候補）" AS ?conf) BIND(1 AS ?ord) }
                ?doc rdfs:label ?label .
                ?f rdfs:label ?flabel .
                OPTIONAL { ?doc caselawp:id ?id . ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?date }
            }} ORDER BY ?ord DESC(?date)
    show:
        type: htable
        columns:
            - id: label
              label: 判例（事件名）
              link: doc
              width: 300
            - id: date
              label: 判決日
              width: 90
            - id: f
              type: link
              string: "?flabel"
              label: 論点
              width: 220
            - id: conf
              type: literal
              label: 確かさ
              width: 80
-   def: gadget
    name: DocAxes
    title: 分類（分野＝何についての事件か、法的論点＝何が争われたか、手続・審級＝どの手続で判断されたか）
    get:
        type: sparql
        src: |
            SELECT ?axis ?c ?clabel ?how ?ord WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?doc a caselawo:CaseLawDocument ; caselawp:id ?id .
                { ?doc caselawp:legalfield ?c . BIND("分野" AS ?axis) BIND("人手" AS ?how) BIND(0 AS ?ord) }
                UNION { ?doc caselawp:legalfieldByRule ?c . BIND("分野" AS ?axis) BIND("規則" AS ?how) BIND(1 AS ?ord) }
                UNION { ?doc caselawp:legalfieldByTopic ?c . BIND("分野" AS ?axis) BIND("トピックから" AS ?how) BIND(2 AS ?ord) }
                UNION { ?doc caselawp:legalIssue ?c . BIND("法的論点" AS ?axis) BIND("強" AS ?how) BIND(3 AS ?ord) }
                UNION { ?doc caselawp:legalIssueCandidate ?c . BIND("法的論点" AS ?axis) BIND("中（候補）" AS ?how) BIND(4 AS ?ord) }
                UNION { ?doc caselawp:procedure ?c . BIND("手続" AS ?axis) BIND("事件記号など" AS ?how) BIND(5 AS ?ord) }
                UNION { ?doc caselawp:instance ?c . BIND("審級" AS ?axis) BIND("事件記号など" AS ?how) BIND(6 AS ?ord) }
                ?c rdfs:label ?clabel .
            }} ORDER BY ?ord ?clabel
    show:
        type: htable
        columns:
            - id: axis
              type: literal
              label: 軸
              width: 90
            - id: c
              type: link
              string: "?clabel"
              label: 分類
              width: 280
            - id: how
              type: literal
              label: 付け方・確かさ
              width: 110
-   def: gadget
    name: facet_legal_issue
    get:
        type: facet
        name: legal_issue
        label: 法的論点（何が争われたか。確かさ 強）
        predicate: caselawp:legalIssue/skos:broader*
        value_type: iri
        limit: 30
        search: true
    show:
        type: facet
-   def: page
    name: LegalIssue
    type: http://ds.rois.ac.jp/caselaw/ontology/LegalIssue
    gadget:
        - IssueInfo
        - IssueHierarchy
        - IssueTopics
        - CaseLawWithThisIssue
# ---- 手続と審級（C 軸: どの手続で、どの審級で判断されたか。hanrei の src/procedure.py の procedure.ttl。2026.11.8）----
-   def: gadget
    name: facet_procedure
    get:
        type: facet
        name: procedure
        label: 手続（どの手続で判断されたか）
        predicate: caselawp:procedure/skos:broader*
        value_type: iri
    show:
        type: facet
-   def: gadget
    name: facet_instance
    get:
        type: facet
        name: instance
        label: 審級
        predicate: caselawp:instance
        value_type: iri
    show:
        type: facet
-   def: gadget
    name: ProcedureInfo
    title: 手続・審級（下位を含む判例の数）
    get:
        type: sparql
        src: |
            SELECT ?rel ?f ?label (COUNT(DISTINCT ?doc) AS ?n) WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { BIND($uri AS ?f) BIND("これ" AS ?rel) BIND(0 AS ?ord) }
                UNION { $uri skos:broader ?f . BIND("上位" AS ?rel) BIND(1 AS ?ord) }
                UNION { ?f skos:broader $uri . BIND("下位" AS ?rel) BIND(2 AS ?ord) }
                ?f rdfs:label ?label .
                OPTIONAL { ?sub skos:broader* ?f . ?doc caselawp:procedure|caselawp:instance ?sub }
            }} GROUP BY ?ord ?rel ?f ?label ORDER BY ?ord ?label
    show:
        type: htable
        columns:
            - id: rel
              type: literal
              label: 関係
              width: 80
            - id: f
              type: link
              string: "?label"
              label: 手続・審級
              width: 240
            - id: n
              type: literal
              label: 判例
              width: 80
-   def: gadget
    name: CaseLawWithThisProcedure
    title: この手続・審級の判例（新しい順）
    collection:
        title: この手続・審級の判決文書
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        page_size: 50
        src: |
            SELECT ?doc ?label ?p ?plabel ?inst ?date WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { ?p skos:broader* $uri . ?doc caselawp:procedure ?p } UNION { ?doc caselawp:instance $uri . ?doc caselawp:procedure ?p }
                ?doc rdfs:label ?label . ?p rdfs:label ?plabel .
                OPTIONAL { ?doc caselawp:instance ?i . ?i rdfs:label ?inst }
                OPTIONAL { ?doc caselawp:id ?id . ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?date }
            }} ORDER BY DESC(?date)
    show:
        type: htable
        columns:
            - id: label
              label: 判例（事件名）
              link: doc
              width: 320
            - id: date
              label: 判決日
              width: 90
            - id: plabel
              label: 手続
              link: p
              width: 140
            - id: inst
              label: 審級
              width: 80
-   def: page
    name: Procedure
    type: http://ds.rois.ac.jp/caselaw/ontology/Procedure
    gadget:
        - ProcedureInfo
        - CaseLawWithThisProcedure
-   def: page
    name: Instance
    type: http://ds.rois.ac.jp/caselaw/ontology/Instance
    gadget:
        - ProcedureInfo
        - CaseLawWithThisProcedure
-   def: gadget
    name: RefCase
    # 本文で参照している事件(refcase.ttl の caselawp:refcase)。裁判所が分かれば事件(caselawo:Case)、分からなければ事件番号(caselawo:CaseNumber)。
    # データ中の判例に照合できたもの(caselawp:citedcaselaw)はその判例へもリンクする(2026.10.18)
    get:
        type: sparql
        src: |
            select distinct ?ref ?reflabel ?kind ?cited ?citedlabel where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id ; caselawp:refcase ?ref .
                ?ref rdfs:label ?reflabel .
                FILTER (!STRSTARTS(STR(?reflabel), "C"))
                OPTIONAL {?ref a ?type . FILTER (?type IN (caselawo:Case, caselawo:CaseNumber))}
                BIND (IF(COALESCE(?type = caselawo:Case, false), "事件（裁判所＋事件番号）", "事件番号") AS ?kind)
                OPTIONAL {
                    ?docid caselawp:citedcaselaw ?cited .
                    ?cited caselawp:id ?cid .
                    ?ct a caselawo:Trial ; caselawp:id ?cid ; caselawp:case ?ccase .
                    FILTER (?ccase = ?ref || EXISTS {?ccase caselawp:casenumber ?ref})
                    ?cited rdfs:label ?citedlabel .
                }
            }} order by ?reflabel
    show:
        type: htable
        columns:
            - id: reflabel
              label: 本文で参照している事件
              link: ref
              width: 200
            - id: kind
              label: 結び先
              width: 140
            - id: citedlabel
              label: データ中の判例
              link: cited
              width: 300
-   def: gadget
    name: Patent
    get:
        type: sparql
        src: |
            select ?patent ?label ?title where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                ?docid caselawp:refpatent ?patent .
                ?patent rdfs:label ?label.
                OPTIONAL {?patent dc:title ?title}
            }}
    show: 
        type: htable
        columns:
            # 特許のページへ(2026.10.18。裁判・判決・判決文書のページに出す)
            - id: label
              label: 参照特許
              link: patent
              width: 120
            - id: title
              label: 発明の名称
              width: 300
-   def: gadget
    name: TermRelation
    # 語のページで共通。同じラベルの判例のターム（caselawo:Term）について（2026.11.5）
    focus: '$uri rdfs:label ?l . ?new rdfs:label ?l ; a caselawo:Term .'
    # 上位・下位・関連のターム（hanrei の src/keywords.py の keywords.ttl。2026.10.17）。
    # 複合語の後ろの部分を上位とする（起訴休職→休職）。「AのB」は B が上位、A が関連（裁量権の濫用→濫用、関連 裁量権）
    get:
        type: sparql
        src: |
            select ?rel ?term where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { $uri skos:broader ?term . BIND("上位" AS ?rel) }
                UNION { ?term skos:broader $uri . BIND("下位" AS ?rel) }
                UNION { $uri skos:related ?term . BIND("関連" AS ?rel) }
                UNION { ?term skos:related $uri . BIND("関連" AS ?rel) }
            }} order by desc(?rel) ?term
    show:
        type: htable
        columns:
            - id: rel
              label: 関係
              width: 60
            - id: term
              label: ターム
              type: link
              display: localname
              width: 250
-   def: gadget
    name: CaseLawWithThisKeyword
    # 語のページで共通。同じラベルの判例のターム（caselawo:Term）について（2026.11.5）
    focus: '$uri rdfs:label ?l . ?new rdfs:label ?l ; a caselawo:Term .'
    # このターム、またはその下位のターム（skos:broader をたどる）をキーワードに持つ判例（2026.10.17）
    # 一覧をそのまま判決文書のコレクションにする（下位の語を含むので、ファセットではなくこのガジェットの SPARQL で。2026.11.11）
    collection:
        title: この語（下位の語を含む）をキーワードに持つ判決文書
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select ?kind ?term ?doc ?label where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?term skos:broader* $uri .
                { ?doc caselawp:論点キーワード ?term . BIND("論点" AS ?kind) }
                UNION { ?doc caselawp:事案キーワード ?term . BIND("事案" AS ?kind) }
                ?doc rdfs:label ?label .
            }} order by ?term ?label
    show:
        type: htable
        columns:
            - id: kind
              label: 種類
              width: 50
            - id: term
              label: キーワード
              type: link
              display: localname
              width: 180
            - id: label
              label: この語（下位の語を含む）をキーワードに持つ判例
              link: doc
              width: 300
-   def: gadget
    name: CaseLawContainingThisTerm
    # 語のページで共通。同じラベルの判例のターム（caselawo:Term）について（2026.11.5）
    focus: '$uri rdfs:label ?l . ?new rdfs:label ?l ; a caselawo:Term .'
    # このタームで絞り込んだ判決文書のコレクションへ（他のタームを加えて OR / AND で組み合わせられる）
    collection:
        class: caselawo:CaseLawDocument
        facet: term
        label: このタームの判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select ?doc ?label where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?doc dct:subject $uri ;
                     rdfs:label ?label .
            }}
    show: 
        type: htable
        columns:
            - id: label
              label: このタームを含む判例
              link: doc
              width: 200
-   def: gadget
    name: CaseLawReferThis
    collection:
        title: この法令を参照する判決文書
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select ?doc ?label where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?doc caselawp:reflaw $uri ;
                     rdfs:label ?label .
            }}
    show: 
        type: htable
        columns:
            - id: label
              label: この法令を参照する判例（事件名）
              link: doc
              width: 200
-   def: gadget
    name: CaseLawReferThisPatent
    collection:
        title: この特許を参照する判決文書
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select ?doc ?label where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?doc caselawp:refpatent $uri ;
                     rdfs:label ?label .
            }} ORDER BY ?label
    show: 
        type: htable
        columns:
            - id: label
              label: この特許を参照する判例（事件名）
              link: doc
              width: 200
-   def: gadget
    name: CaseNumberInfo
    # 事件番号の通称・説明(Wikipediaの記事。caseinfo.ttl)。rdfs:label は info.ttl の「昭和62(あ)1351」を使う(caseinfo.ttl の「C昭和62あ1351」は除く)
    get:
        type: sparql
        src: |
            select (sample(?l) as ?label) (group_concat(distinct ?pn; separator=" / ") as ?popularname)
                   (sample(?ab) as ?abstract) (sample(?sa) as ?sameas) where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:label ?l .
                FILTER (!STRSTARTS(STR(?l), "C"))
                OPTIONAL {$uri caselawp:popularname ?pn}
                OPTIONAL {$uri rdfs:comment ?ab}
                OPTIONAL {$uri owl:sameAs ?sa}
            }}
    show:
        type: vtable
        columns:
            - id: label
              label: 事件番号
              width: 100
            - id: popularname
              label: 通称
            - id: sameas
              label: Wikipedia（DBpedia）
              type: directlink
            - id: abstract
              label: 説明
-   def: gadget
    name: CaseNumberMentions
    # この事件に触れているWikipediaの記事(人物・団体・罪名などの記事。caseinfo.ttl の rdfs:seeAlso)。
    # 記事の名前は DBpedia のリソースの名前(ja.dbpedia.org/resource/ の後)、リンクは Wikipedia の記事(2026.10.18)
    get:
        type: sparql
        src: |
            select ?name ?wikipedia ?see where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:seeAlso ?see .
                BIND (REPLACE(STR(?see), "^https?://ja.dbpedia.org/resource/", "") as ?name)
                BIND (CONCAT("https://ja.wikipedia.org/wiki/", ENCODE_FOR_URI(?name)) as ?wikipedia)   # 文字化けしないよう符号化してからつなぐ
            }} order by ?name
    show:
        type: htable
        columns:
            - id: name
              label: この事件に触れている記事（Wikipedia）
              type: directlink
              href: "?wikipedia"
              width: 300
            - id: see
              label: DBpedia
              type: directlink
              width: 300
-   def: gadget
    name: CaseWithThisNumber
    # この事件番号の事件(裁判所＋事件番号。caselawp:casenumber)と、その裁判(caselawp:case)。事件番号は裁判所ごとに付くので、別の裁判所の別の事件のこともある
    collection:
        title: この事件番号の裁判
        var: trial
        class: caselawo:Trial
        label: 裁判をコレクションとして表示
    get:
        type: sparql
        src: |
            select ?trial ?tlabel ?court where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?case caselawp:casenumber $uri .
                ?trial caselawp:case ?case ;
                       rdfs:label ?tlabel .
                OPTIONAL {?trial caselawp:court ?court}
            }} order by ?court ?tlabel
    show:
        type: htable
        columns:
            - id: tlabel
              label: 裁判（事件番号・事件名）
              link: trial
              width: 400
            - id: court
              label: 裁判所
              display: localname
              width: 160
-   def: gadget
    name: CaseLawReferringThisNumber
    # 本文でこの事件番号を参照している判決文書(refcase.ttl の caselawp:refcase)。裁判所の分からない参照は事件番号に、
    # 分かる参照は事件(caselawo:Case)に結んであるので、両方を集める
    collection:
        title: この事件番号を参照している判例
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select distinct ?doc ?label ?via where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { ?doc caselawp:refcase $uri . BIND("事件番号" as ?via) }
                UNION
                { ?case caselawp:casenumber $uri . ?doc caselawp:refcase ?case . BIND("事件（裁判所＋事件番号）" as ?via) }
                ?doc rdfs:label ?label .
            }} order by ?label
            limit 500
    show:
        type: htable
        columns:
            - id: label
              label: この事件番号を本文で参照している判例
              link: doc
              width: 300
            - id: via
              label: 参照の結び先
              width: 150
-   def: gadget
    name: CaseLawRelevantToThis
    collection:
        title: この事件の裁判
        var: doc
        class: caselawo:Trial
        label: 裁判をコレクションとして表示
    get:
        type: sparql
        src: |
            select ?doc ?label where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?doc caselawp:case $uri ;
                     rdfs:label ?label .
            }}
    show: 
        type: htable
        columns:
            - id: label
              label: この事件の裁判（事件名）
              link: doc
              width: 300
-   def: gadget
    name: CaseLawIdInfo
    # 判例IDの中身（データにある判決は判決から、データに無い判決は判例ID自身の裁判所・日付・事件番号から。2026.11.10）
    get:
        type: sparql
        src: |
            select ?ecli ?key ?court ?date ?caseno ?status where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:label ?ecli .
                OPTIONAL {$uri caselawp:caseLawKey ?key}
                OPTIONAL {$uri caselawp:judgment ?j . ?j caselawp:id ?id .
                          OPTIONAL {?j caselawp:judgmentdate ?date}
                          OPTIONAL {?t a caselawo:Trial ; caselawp:id ?id ; caselawp:court ?court ; caselawp:caseno ?caseno}}
                OPTIONAL {$uri caselawp:court ?court}
                OPTIONAL {$uri caselawp:judgmentdate ?date}
                OPTIONAL {$uri caselawp:caseno ?caseno}
                BIND(IF(BOUND(?j), "データにある", "データに無い（判決文中の引用・原審から作った判例ID）") AS ?status)
            }} limit 1
    show:
        type: vtable
        attribute_width: 110
        columns:
            - id: ecli
              label: 判例ID
            - id: key
              label: 判例キー
            - id: court
              label: 裁判所
              display: localname
            - id: date
              label: 裁判年月日
            - id: caseno
              label: 事件番号
            - id: status
              label: データ
-   def: gadget
    name: CaseLawIdDocs
    title: この判例IDの判例
    # 判例IDの判決の判決文書（同じ判決が重ねて掲載されたものは複数。2026.11.10）
    get:
        type: sparql
        src: |
            select distinct ?doc ?label ?source where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:judgment ?j . ?j caselawp:id ?id .
                ?doc a caselawo:CaseLawDocument ; caselawp:id ?id ; rdfs:label ?label .
                OPTIONAL {?doc dcterms:source/rdfs:label ?source}
            }} order by ?doc
    show:
        type: htable
        columns:
            - id: label
              label: 判例
              link: doc
              width: 360
            - id: source
              label: 出典
              width: 160
-   def: gadget
    name: CaseLawIdCitedBy
    title: この判例を引用している判例
    # 判決文中でこの判例を引用している判例（caselawp:citesCaseLaw。データに無い判決の判例IDでも。2026.11.10）
    collection:
        title: この判例を引用している判例
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select distinct ?doc ?label ?court ?date where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?doc caselawp:citesCaseLaw $uri ; caselawp:id ?did ; rdfs:label ?label .
                OPTIONAL {?t a caselawo:Trial ; caselawp:id ?did ; caselawp:court ?court}
                OPTIONAL {?j a caselawo:Judgment ; caselawp:id ?did ; caselawp:judgmentdate ?date}
            }} order by desc(?date)
            limit 500
    show:
        type: htable
        columns:
            - id: label
              label: この判例を引用している判例
              link: doc
              width: 300
            - id: court
              label: 裁判所
              display: localname
              width: 160
            - id: date
              label: 判決日
              width: 100
-   def: gadget
    name: CaseLawIdAppealed
    title: この判例を原審とする判例
    # 上訴審の判例（caselawp:originalCaseLaw。2026.11.10）
    get:
        type: sparql
        src: |
            select distinct ?doc ?label ?court ?date where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?j caselawp:originalCaseLaw $uri ; caselawp:id ?did .
                ?doc a caselawo:CaseLawDocument ; caselawp:id ?did ; rdfs:label ?label .
                OPTIONAL {?t a caselawo:Trial ; caselawp:id ?did ; caselawp:court ?court}
                OPTIONAL {?j caselawp:judgmentdate ?date}
            }} order by ?date
    show:
        type: htable
        columns:
            - id: label
              label: この判例を原審とする判例
              link: doc
              width: 300
            - id: court
              label: 裁判所
              display: localname
              width: 160
            - id: date
              label: 判決日
              width: 100
-   def: gadget
    name: CaseLawIdCites
    title: この判例が引用している判例
    # データにある判決が判決文中で引用している判例（判例ID。2026.11.10）
    get:
        type: sparql
        src: |
            select distinct ?cid ?ecli ?key ?doc2 ?label2 where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:judgment ?j . ?j caselawp:id ?id .
                ?d a caselawo:CaseLawDocument ; caselawp:id ?id ; caselawp:citesCaseLaw ?cid .
                ?cid rdfs:label ?ecli .
                OPTIONAL {?cid caselawp:caseLawKey ?key}
                # データにある判決なら判決文書へ（同じ判決の重複掲載は複数行）
                OPTIONAL {?cid caselawp:judgment ?j2 . ?j2 caselawp:id ?id2 .
                          ?doc2 a caselawo:CaseLawDocument ; caselawp:id ?id2 ; rdfs:label ?label2}
            }} order by ?key
            limit 300
    show:
        type: htable
        columns:
            - id: ecli
              label: 判例ID
              link: cid
              width: 260
            - id: key
              label: 判例キー
              width: 260
            - id: label2
              label: データ中の判例
              link: doc2
              width: 260
-   def: gadget
    name: DocCitesCaseLaw
    title: 引用している判例（判例ID）
    # 判決文中の引用を判例IDで結んだもの。データに無い判決への引用も出る（hanrei の src/caseidlink.py。2026.11.10）
    get:
        type: sparql
        src: |
            select distinct ?cid ?ecli ?key ?doc2 ?label2 where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?d a caselawo:CaseLawDocument ; caselawp:id ?id ; caselawp:citesCaseLaw ?cid .
                ?cid rdfs:label ?ecli .
                OPTIONAL {?cid caselawp:caseLawKey ?key}
                # データにある判決なら判決文書へ（同じ判決の重複掲載は複数行）
                OPTIONAL {?cid caselawp:judgment ?j2 . ?j2 caselawp:id ?id2 .
                          ?doc2 a caselawo:CaseLawDocument ; caselawp:id ?id2 ; rdfs:label ?label2}
            }} order by ?key
            limit 300
    show:
        type: htable
        columns:
            - id: ecli
              label: 判例ID
              link: cid
              width: 260
            - id: key
              label: 判例キー
              width: 260
            - id: label2
              label: データ中の判例
              link: doc2
              width: 260
-   def: gadget
    name: CaseInfo
    # 事件(裁判所＋事件番号)の事件番号と裁判所(info.ttl。データ中に無い事件は refcase.ttl。2026.10.19)
    get:
        type: sparql
        src: |
            select ?casenumber ?casenumberlabel ?court where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                OPTIONAL {$uri caselawp:casenumber ?casenumber . OPTIONAL {?casenumber rdfs:label ?casenumberlabel}}
                OPTIONAL {$uri caselawp:court ?court}
            }} limit 1
    show:
        type: vtable
        attribute_width: 110
        columns:
            - id: casenumberlabel
              label: 事件番号
              # 事件番号のページへ(同じ事件番号の別の裁判所の事件・この事件番号を参照している判例)
              link: casenumber
            - id: court
              label: 裁判所
              display: localname
              # その裁判所の裁判のコレクションへ
              collection:
                  class: caselawo:Trial
                  facet: trial_court
-   def: gadget
    name: CaseLawCitingThis
    title: この判例を引用している判例
    # この判例を本文で引用している判例(refcase.ttl の caselawp:citedcaselaw の逆。2026.10.20)。
    # 判決文書・裁判・判決のどのページからでも、caselawp:id で判決文書へたどる
    collection:
        title: この判例を引用している判例
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select distinct ?doc ?label ?court ?date where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?target a caselawo:CaseLawDocument ; caselawp:id ?id .
                ?doc caselawp:citedcaselaw ?target ;
                     caselawp:id ?did ;
                     rdfs:label ?label .
                OPTIONAL {?t a caselawo:Trial ; caselawp:id ?did ; caselawp:court ?court}
                OPTIONAL {?j a caselawo:Judgment ; caselawp:id ?did ; caselawp:judgmentdate ?date}
            }} order by desc(?date)
            limit 500
    show:
        type: htable
        columns:
            - id: label
              label: この判例を引用している判例
              link: doc
              width: 300
            - id: court
              label: 裁判所
              display: localname
              width: 160
            - id: date
              label: 判決日
              width: 100
-   def: gadget
    name: CaseLawReferringThisCase
    # 本文でこの事件(裁判所＋事件番号)を参照している判決文書(refcase.ttl の caselawp:refcase。2026.10.19)
    collection:
        title: この事件を参照している判例
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select distinct ?doc ?label where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?doc caselawp:refcase $uri ;
                     rdfs:label ?label .
            }} order by ?label
            limit 500
    show:
        type: htable
        columns:
            - id: label
              label: この事件を本文で参照している判例
              link: doc
              width: 300
-   def: gadget
    name: SimilarCaseLaw
    # 類似判例（src/embed.py --task ttl の similar.ttl。中労委と hanrei）。裁判・判決・判決文書のページから caselawp:id でたどる
    # 共通点: 中労委は共通の判示事項、hanreiは共通の参照判例(caselawp:sharedCitedCaseLaw)と参照法令の条(caselawp:sharedRefLaw)、
    # 共通のキーワード(caselawp:sharedKeyword。2026.10.17)
    collection:
        title: 類似判例
        var: doc
        class: caselawo:CaseLawDocument
        label: 類似判例をコレクションとして表示
    get:
        type: sparql
        src: |
            # 1行 = 類似判例 × 共通の項目 × 共通のキーワード（表示は group_by: doc で類似判例ごとに1行にまとめ、各項目をリンクにする。2026.10.26）
            select ?rank ?doc ?label ?t ?tl ?k ?kl where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?self a caselawo:CaseLawDocument ;
                      caselawp:id ?id ;
                      caselawp:similar ?s .
                ?s caselawp:similarDocument ?doc ;
                   caselawp:rank ?rank .
                ?doc rdfs:label ?label .
                OPTIONAL {
                    ?s churoip:共通の判示事項|caselawp:sharedCitedCaseLaw|caselawp:sharedRefLaw ?t .
                    ?t rdfs:label ?tl .
                }
                # 共通のキーワード（caselawp:sharedKeyword。2026.10.17）
                OPTIONAL {
                    ?s caselawp:sharedKeyword ?k .
                    ?k rdfs:label ?kl .
                }
            }} order by ?rank
    show:
        type: htable
        group_by: doc
        columns:
            - id: rank
              label: 順位
              width: 40
            - id: label
              label: 類似判例（同じ紛争の判例を除く）
              link: doc
              width: 300
            - id: t
              type: link
              string: "?tl"
              label: 共通の判示事項・参照判例・参照法令
              width: 200
            - id: k
              type: link
              string: "?kl"
              label: 共通のキーワード
              width: 200
-   def: gadget
    name: AppealCaseLaw
    # 「審級を並べて比べる」: この判例と一覧の判例（?doc）を /compare で列に並べる（2026.10.26）
    compare:
        var: doc
        label: 審級を並べて比べる
    # 上訴審・原審の判例（hanrei の src/appealttl.py の appeal.ttl。2026.10.14）。裁判・判決・判決文書のページから caselawp:id で審理(T)へたどり、
    # caselawp:原審判例（上訴審→原審）・caselawp:上訴審判例（原審→上訴審）を2段までたどる（地裁→高裁→最高裁）
    get:
        type: sparql
        src: |
            select distinct ?kind ?date ?court ?doc ?label where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?t a caselawo:Trial ; caselawp:id ?id .
                {
                    ?t caselawp:原審判例 ?t2 . BIND("原審" AS ?kind)
                } UNION {
                    ?t caselawp:原審判例/caselawp:原審判例 ?t2 . BIND("原審の原審" AS ?kind)
                } UNION {
                    ?t caselawp:上訴審判例 ?t2 . BIND("上訴審" AS ?kind)
                } UNION {
                    ?t caselawp:上訴審判例/caselawp:上訴審判例 ?t2 . BIND("上訴審の上訴審" AS ?kind)
                }
                ?t2 caselawp:id ?id2 .
                OPTIONAL {?t2 caselawp:court ?court}
                ?doc a caselawo:CaseLawDocument ; caselawp:id ?id2 ; rdfs:label ?label .
                OPTIONAL {?j a caselawo:Judgment ; caselawp:id ?id2 ; caselawp:judgmentdate ?date}
            }} order by ?date
    show:
        type: htable
        columns:
            - id: kind
              label: 審級
              width: 90
            - id: date
              label: 裁判年月日
              width: 90
            - id: court
              label: 裁判所
              display: localname
              width: 150
            - id: label
              label: 上訴審・原審の判例
              link: doc
              width: 300
-   def: gadget
    name: Proceeding
    # 顛末（同じ紛争の命令・判決）。中労委の判例だけ
    get:
        type: sparql
        src: |
            select ?p ?label ?date ?kind where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri churoip:proceeding ?p .
                ?p rdfs:label ?label .
                OPTIONAL {?p churoip:orderdate ?date}
                OPTIONAL {?p churoip:区分 ?kind}
                # 判例の日付は caselawp:id で判決(J)へ(caselawp:decision は 2026.10.14 に廃止)
                OPTIONAL {?p a caselawo:Trial ; caselawp:id ?pid . ?pj a caselawo:Judgment ; caselawp:id ?pid ; caselawp:judgmentdate ?date}
            }} order by ?date
    show:
        type: htable
        columns:
            - id: date
              label: 年月日
              width: 90
            - id: label
              label: 顛末（同じ紛争の命令・判決）
              link: p
              width: 300
            - id: kind
              label: 命令区分
              width: 150
