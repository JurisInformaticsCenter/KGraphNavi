-   def: gadget
    name: LegislationInfo
    get:
        type: sparql
        src: |
            select ?label ?lawNum ?lawid ?lawType ?del_flg ?elaws where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:label ?label ;
                     lawp:lawNum ?lawNum ;
                     lawp:lawID ?lawid ;
                     lawp:detailedLawType ?lawType .
                OPTIONAL {$uri lawp:del_flg ?del_flg}
                OPTIONAL {$uri owl:sameAs ?elaws}
            }}
    show: 
        type: vtable
        columns:
            - id: label
              label: 法令名称
              width: 100
            - id: lawNum
              label: 法令番号
            - id: lawid
              label: 法令ID
            - id: lawType
              label: 法令種別
            - id: del_flg
              label: 廃止法令
            - id: elaws
              label: eLaws
              type: directlink
-   def: gadget
    name: ClauseInfo
    # 条(項)の見出し・状態・法令・解説(2026.10.18)。見出しは e-Gov の現行の法令のもの(src/lawcaption.py)。
    # データの文字列は CONCAT でつながない(Virtuoso で文字化けする)
    get:
        type: sparql
        src: |
            select ?label ?caption ?common ?status ?amd ?law ?lawlabel ?elaws ?commentary where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:label ?label .
                OPTIONAL {$uri lawp:caption ?caption}
                OPTIONAL {$uri lawp:commonCaption ?common}
                OPTIONAL {$uri lawp:clauseStatus ?cs}
                OPTIONAL {$uri lawp:commentary ?commentary}
                OPTIONAL {$uri lawp:law ?law . OPTIONAL {?law rdfs:label ?lawlabel} OPTIONAL {?law owl:sameAs ?elaws}
                          OPTIONAL {?law lawp:del_flg ?del} OPTIONAL {?law lawp:lastAmendmentDate ?amd}}
                BIND (IF(COALESCE(STR(?del) = "1", false), "廃止法令", ?cs) AS ?status)
            }} limit 1
    show:
        type: vtable
        columns:
            - id: label
              label: 条
              width: 100
            - id: caption
              label: 見出し
            - id: common
              label: 共通見出し（前の条の見出し）
            - id: status
              label: 状態（現行の法令で）
            - id: amd
              label: 法令の最終改正の施行日
            - id: lawlabel
              label: 法令
              link: law
            - id: elaws
              label: e-Gov法令検索
              type: directlink
            - id: commentary
              label: 解説（Wikibooks）
              type: directlink
-   def: gadget
    name: ClauseText
    title: 条文
    # 条(項・号)の条文(~/nii/law の法令データ。sentence.ttl・lawstruct.ttl、e-Laws の2022年10月の版。2026.10.20)。
    # 文は項に付いているので、条のページでは lawp:upper をたどって下の項・号の文も出す。
    # 法令データは判例とは別のグラフに読み込むので、graph を指定しない。読み込んでいなければ何も出ない
    get:
        type: sparql
        src: |
            select ?clause ?label ?ci ?si ?text where {
                ?clause lawp:upper* $uri .
                ?s a lawo:Sentence ;
                   lawp:clause ?clause ;
                   doco:index ?si ;
                   cnt:chars ?text .
                OPTIONAL {?clause lawp:index ?ci}
                OPTIONAL {?clause rdfs:label ?label . FILTER (CONTAINS(STR(?label), "第"))}
            } order by ?ci ?clause ?si
            limit 300
    show:
        type: htable
        columns:
            - id: label
              label: 条項（2022年10月の版）
              link: clause
              width: 220
            - id: text
              label: 条文
              width: 600
-   def: gadget
    name: PatentInfo
    get:
        type: sparql
        src: |
            select ?label ?link ?title ?description where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:label ?label;
                     dc:identifier ?patentid.
                OPTIONAL {$uri dc:title ?title}
                OPTIONAL {$uri dc:description ?description}
                OPTIONAL {$uri owl:sameAs ?link}
            }}
    show: 
        type: htable
        columns:
            - id: label
              label: 特許番号
              width: 120
            - id: link
              label: Google Patents
              width: 120
              display: localname
              type: directlink
            - id: title
              label: タイトル
              width: 200
            - id: description
              label: 要約
              width: 400
-   def: gadget
    name: Term
    get:
        type: sparql
        src: |
            select ?term where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                ?docid dcterms:subject ?term .
            }}
    show: 
        type: htable
        # 同じ語を含む語でまとめる(2026.10.18)。親は、その判例のタームのうち自分を部分に含む最も長い語
        # (「マンション」>「マンション建設」>「マンション建設工事」)。まとまりの大きい語を先に並べる
        tree:
            column: term
            parent_by: contains
            strip_parent: false
            order: size
            # 階層表示の表はページ送りしないので、語が多い判例でも短くなるよう、最初は子を折りたたむ(2026.10.19)
            collapsed: true
        columns:
            - id: term
              label: ターム
              type: link
              display: localname
              width: 200
-   def: gadget
    name: LawDefinition
    title: 法令上の定義
    # 法令の定義規定で、この語を定義しているもの(~/nii/law の defword.ttl。2026.10.20)。
    # 法令の定義語は law:<語>(lawo:Term)で、判例のターム caselaw:<語> とはラベルの文字列で結ぶ。
    # 同じ語でも法令ごとに意味が違うことがあるので、法令・条項と一緒に出す
    get:
        type: sparql
        src: |
            select distinct ?body ?clause ?clauselabel ?law ?lawlabel where {
                $uri rdfs:label ?label .
                ?lt a lawo:Term ; rdfs:label ?label .
                ?def a lawo:Definition ;
                     oa:hasBody ?b ;
                     oa:hasTarget ?tgt .
                ?b lawp:term ?lt ; lawp:body ?body .
                ?tgt oa:hasSource ?s .
                ?s lawp:clause ?clause ; lawp:law ?law .
                OPTIONAL {?clause rdfs:label ?clauselabel . FILTER (CONTAINS(STR(?clauselabel), "第"))}
                OPTIONAL {?law rdfs:label ?lawlabel}
            } order by ?lawlabel ?clause
            limit 200
    show:
        type: htable
        group_by: clause
        columns:
            - id: body
              label: 法令上の定義（2022年10月の版）
              width: 420
            - id: clauselabel
              label: 条項
              link: clause
              width: 220
-   def: gadget
    name: Keyword
    # 論点キーワード・事案キーワード（hanrei の src/keywords.py の keywords.ttl。2026.10.16 試作）。
    # 判決文書に付く。裁判・判決のページからは caselawp:id で判決文書へたどる
    get:
        type: sparql
        src: |
            select ?kind ?term where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                {
                    ?docid caselawp:論点キーワード ?term . BIND("論点" AS ?kind)
                } UNION {
                    ?docid caselawp:事案キーワード ?term . BIND("事案" AS ?kind)
                }
            }} order by desc(?kind) ?term
    show:
        type: htable
        columns:
            - id: kind
              label: 種類
              width: 60
            - id: term
              label: キーワード
              type: link
              display: localname
              width: 250
-   def: gadget
    name: Legislation
    # 参照法令(2026.10.18)。法令・条ごとに1行。旧法令は当時の題名(lawp:historicalTitle)を先に。
    # Virtuoso では、データの文字列と問い合わせに書いた文字列を CONCAT でつなぐと文字化けする(「現行」→「ç¾è¡」)ので、
    # データの値(見出し・状態)と、問い合わせに書いた文字列だけの「注意」の列を分ける。解説のリンクもデータ(lawp:commentary)から
    get:
        type: sparql
        src: |
            select ?legislation (sample(?label0) as ?label) (sample(?caption0) as ?caption) (sample(?status0) as ?status)
                   (sample(?note0) as ?note) (sample(?commentary0) as ?commentary) where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                ?docid caselawp:reflaw ?legislation .
                OPTIONAL{?legislation rdfs:label ?l}
                OPTIONAL{?legislation lawp:historicalTitle ?ht}
                BIND (COALESCE(?ht, ?l) AS ?label0)
                OPTIONAL{?legislation lawp:law ?law0}
                BIND (COALESCE(?law0, ?legislation) AS ?law)
                OPTIONAL{?law lawp:del_flg ?del}
                OPTIONAL{?legislation lawp:clauseStatus ?cs}
                OPTIONAL{?law lawp:lastAmendmentDate ?amd}
                OPTIONAL{?law lawp:promulgationDate ?prom}
                OPTIONAL{?jg a caselawo:Judgment; caselawp:id ?id; caselawp:judgmentdate ?jd}
                # 条見出し(src/lawcaption.py。e-Gov)。共通見出しを引き継いだものは「注意」に書く
                OPTIONAL{?legislation lawp:caption ?cap1}
                OPTIONAL{?legislation lawp:commonCaption ?cap2}
                BIND (COALESCE(?cap1, ?cap2) AS ?caption0)
                # 状態: 廃止法令(lawp:del_flg)、条の状態(lawp:clauseStatus。現行/削除/現行に無い条)
                BIND (IF(COALESCE(STR(?del) = "1", false), "廃止法令", ?cs) AS ?status0)
                # 注意(問い合わせに書いた文字列だけ): 判決日が公布日より前(旧法の参照)、判決日より後の法令改正、共通見出し
                BIND (IF(COALESCE(?prom > ?jd, false), "判決時には未公布（旧法の参照）",
                      IF(COALESCE(?amd > ?jd, false),
                         IF(BOUND(?cap2) && !BOUND(?cap1), "判決後に法令改正あり（条は未確認）。見出しは前の条の共通見出し", "判決後に法令改正あり（条は未確認）"),
                         IF(BOUND(?cap2) && !BOUND(?cap1), "見出しは前の条の共通見出し", ?unbound))) AS ?note0)
                OPTIONAL{?legislation lawp:commentary ?commentary0}
            }} group by ?legislation order by ?label
    show:
        type: htable
        # 法令 > 条 > 項 > 号 の階層で表示する(2026.10.18)。親は IRI の末尾の「_…」を外したもの
        # (…_570_1 → …_570 → 法令)。子の名称は親の名称を省く(「民法570条第1項」→「第1項」)。数字は数の大小で並べる
        tree:
            node: legislation
            parent_regex: "_[^_/]*$"
            column: label
            # 親(条)と同じ見出し・解説は、子(項・号)の行では空にする
            same_as_parent: [caption, commentary]
        columns:
            # 法令・条のページへ
            - id: label
              label: 法令名称
              link: legislation
              width: 220
            - id: caption
              label: 見出し
              width: 200
            - id: status
              label: 状態
              width: 90
            - id: note
              label: 注意
              width: 220
            - id: commentary
              display: localname
              label: 解説（Wikibooks）
              type: directlink
              width: 130
-   def: gadget
    name: Punishment
    get:
        type: sparql
        src: |
            select ?ptype ?duration ?suspend where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?judgmentid a caselawo:Judgment; caselawp:id ?id .
                ?judgmentid caselawp:punishment ?punishment .
                ?punishment a ?ptype .
                OPTIONAL{?punishment time:hasDurationDescription ?duration}
                OPTIONAL{?punishment caselawp:hasSuspendedSentence ?suspend}
            }}
    show: 
