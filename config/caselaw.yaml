-   def: gadget
    name: Involved
    collection:
        title: 関与した裁判
        var: judge
        class: caselawo:Trial
        label: 関与した裁判をコレクションとして表示
    get:
        type: sparql
        src: |
            select distinct ?caseno ?casename ?role ?judge ?opinion ?concurred where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?personrole caselawp:person $uri; caselawp:role ?role.
                ?judge caselawp:judge|caselawp:party ?personrole; caselawp:caseno ?caseno; caselawp:casename ?casename .
                # この人が述べた個別意見・同調した個別意見の種類(opinion.ttl。2026.10.19)
                OPTIONAL {?op caselawp:author $uri; caselawp:id ?opid; caselawp:opinionKind ?opinion . ?judge caselawp:id ?opid .}
                OPTIONAL {?op2 caselawp:concurredBy $uri; caselawp:id ?opid2; caselawp:opinionKind ?concurred . ?judge caselawp:id ?opid2 .}
            }}
    show: 
        type: htable
