-   def: gadget
    name: PageFrequencyDistribution
    get:
        type: sparql
        src: |
            SELECT ?npages (COUNT(?npages) AS ?count)
            WHERE {
                $collection
                ?entity dcterms:extent ?npages .
            }
            GROUP BY ?npages
            ORDER BY ?npages
    show: 
        type: htable
