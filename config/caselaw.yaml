#   /collection?view=ChuroiCaseLaw。要素は中労委の判決文書（出典 dcterms:source が caselaw:Source_churoi のもの）
#   判決文書には裁判所・判示事項などが無いので、ファセットは caselawp:id で同じ判例の裁判（T）・判決（J）をたどる
-   def: page
    name: ChuroiCaseLaw
    type: collection
    query: |
        SELECT ?uri
        WHERE {
            ?uri a caselawo:CaseLawDocument ;
                 dcterms:source caselaw:Source_churoi .
        }
    sidebar:
        - facet_churoi_topic
        - facet_churoi_court
        - facet_churoi_casecategory
        - facet_churoi_disposition
        - facet_year
    tabs:
        - label: 一覧
          gadget:
            - ChuroiCaseLawList
-   def: gadget
    name: ChuroiCaseLawList
    title: 中労委の判例
    get:
        type: sparql
        page_size: 50
        src: |
            SELECT ?entity ?no ?casename ?court ?date ?disposition
            WHERE {
                $collection
                ?entity caselawp:id ?id ;
                        churoip:no ?no .
                OPTIONAL { ?t a caselawo:Trial ; caselawp:id ?id .
                           OPTIONAL { ?t caselawp:casename ?casename }
                           OPTIONAL { ?t caselawp:court ?court } }
                OPTIONAL { ?j a caselawo:Judgment ; caselawp:id ?id .
                           OPTIONAL { ?j caselawp:judgmentdate ?date }
                           OPTIONAL { ?j caselawp:disposition ?disposition } }
            }
            ORDER BY DESC(?date)
    show:
        type: htable
        group_by: entity
        columns:
            - id: entity
              type: link
              string: "?no"
              label: 判例番号
              width: 100
            - id: casename
              label: 事件名
              width: 360
            - id: court
              label: 裁判所
              display: localname
              width: 140
              collection:
                  view: ChuroiCaseLaw
                  facet: churoi_court
            - id: date
              label: 判決年月日
              width: 90
            - id: disposition
              label: 判決区分
              display: localname
              width: 120
              collection:
                  view: ChuroiCaseLaw
                  facet: churoi_disposition
