-   def: gadget
    name: CaseLawCitingThis
    title: この判例を引用している判例
    # この判例を本文で引用している判例(refcase.ttl の caselawp:citedcaselaw の逆。2026.10.20)。
    # 判決文書・裁判・判決のどのページからでも、caselawp:id で判決文書へたどる
    collection:
        title: この判例を引用している判例
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select distinct ?doc ?label ?court ?date where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?target a caselawo:CaseLawDocument ; caselawp:id ?id .
                ?doc caselawp:citedcaselaw ?target ;
                     caselawp:id ?did ;
                     rdfs:label ?label .
                OPTIONAL {?t a caselawo:Trial ; caselawp:id ?did ; caselawp:court ?court}
                OPTIONAL {?j a caselawo:Judgment ; caselawp:id ?did ; caselawp:judgmentdate ?date}
            }} order by desc(?date)
            limit 500
    show:
        type: htable
        columns:
            - id: label
              label: この判例を引用している判例
              link: doc
              width: 300
            - id: court
              label: 裁判所
              display: localname
              width: 160
            - id: date
              label: 判決日
              width: 100
-   def: gadget
    name: CaseLawReferringThisCase
    # 本文でこの事件(裁判所＋事件番号)を参照している判決文書(refcase.ttl の caselawp:refcase。2026.10.19)
    collection:
        title: この事件を参照している判例
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select distinct ?doc ?label where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?doc caselawp:refcase $uri ;
                     rdfs:label ?label .
            }} order by ?label
            limit 500
    show:
        type: htable
        columns:
            - id: label
              label: この事件を本文で参照している判例
              link: doc
              width: 300
-   def: gadget
    name: SimilarCaseLaw
    # 類似判例（src/embed.py --task ttl の similar.ttl。中労委と hanrei）。裁判・判決・判決文書のページから caselawp:id でたどる
    # 共通点: 中労委は共通の判示事項、hanreiは共通の参照判例(caselawp:sharedCitedCaseLaw)と参照法令の条(caselawp:sharedRefLaw)、
    # 共通のキーワード(caselawp:sharedKeyword。2026.10.17)
    collection:
        title: 類似判例
        var: doc
        class: caselawo:CaseLawDocument
        label: 類似判例をコレクションとして表示
    get:
        type: sparql
        src: |
            # 1行 = 類似判例 × 共通の項目 × 共通のキーワード（表示は group_by: doc で類似判例ごとに1行にまとめ、各項目をリンクにする。2026.10.26）
            select ?rank ?doc ?label ?t ?tl ?k ?kl where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?self a caselawo:CaseLawDocument ;
                      caselawp:id ?id ;
                      caselawp:similar ?s .
                ?s caselawp:similarDocument ?doc ;
                   caselawp:rank ?rank .
                ?doc rdfs:label ?label .
                OPTIONAL {
                    ?s churoip:共通の判示事項|caselawp:sharedCitedCaseLaw|caselawp:sharedRefLaw ?t .
                    ?t rdfs:label ?tl .
                }
                # 共通のキーワード（caselawp:sharedKeyword。2026.10.17）
                OPTIONAL {
                    ?s caselawp:sharedKeyword ?k .
                    ?k rdfs:label ?kl .
                }
            }} order by ?rank
    show:
        type: htable
        group_by: doc
        columns:
            - id: rank
              label: 順位
              width: 40
            - id: label
              label: 類似判例（同じ紛争の判例を除く）
              link: doc
              width: 300
            - id: t
              type: link
              string: "?tl"
              label: 共通の判示事項・参照判例・参照法令
              width: 200
            - id: k
              type: link
              string: "?kl"
              label: 共通のキーワード
              width: 200
-   def: gadget
    name: AppealCaseLaw
    # 「審級を並べて比べる」: この判例と一覧の判例（?doc）を /compare で列に並べる（2026.10.26）
    compare:
        var: doc
        label: 審級を並べて比べる
    # 上訴審・原審の判例（hanrei の src/appealttl.py の appeal.ttl。2026.10.14）。裁判・判決・判決文書のページから caselawp:id で審理(T)へたどり、
    # caselawp:原審判例（上訴審→原審）・caselawp:上訴審判例（原審→上訴審）を2段までたどる（地裁→高裁→最高裁）
    get:
        type: sparql
        src: |
            select distinct ?kind ?date ?court ?doc ?label where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?t a caselawo:Trial ; caselawp:id ?id .
                {
                    ?t caselawp:原審判例 ?t2 . BIND("原審" AS ?kind)
                } UNION {
                    ?t caselawp:原審判例/caselawp:原審判例 ?t2 . BIND("原審の原審" AS ?kind)
                } UNION {
                    ?t caselawp:上訴審判例 ?t2 . BIND("上訴審" AS ?kind)
                } UNION {
                    ?t caselawp:上訴審判例/caselawp:上訴審判例 ?t2 . BIND("上訴審の上訴審" AS ?kind)
                }
                ?t2 caselawp:id ?id2 .
                OPTIONAL {?t2 caselawp:court ?court}
                ?doc a caselawo:CaseLawDocument ; caselawp:id ?id2 ; rdfs:label ?label .
                OPTIONAL {?j a caselawo:Judgment ; caselawp:id ?id2 ; caselawp:judgmentdate ?date}
            }} order by ?date
    show:
        type: htable
        columns:
            - id: kind
              label: 審級
              width: 90
            - id: date
              label: 裁判年月日
              width: 90
            - id: court
              label: 裁判所
              display: localname
              width: 150
            - id: label
              label: 上訴審・原審の判例
              link: doc
              width: 300
