            - id: from
              label: 最も古い年
              width: 80
            - id: to
              label: 最も新しい年
              width: 80
-   def: gadget
    name: PdfCreatedYearBar
    title: PDFの作成年（判決の年ではなく、PDFファイルが作られた年）
    get:
        type: sparql
        src: |
            SELECT ?y (COUNT(?entity) AS ?count)
            WHERE {
                $collection
                ?entity prism:creationDate ?created .
                BIND(YEAR(?created) AS ?y)
            }
            GROUP BY ?y
