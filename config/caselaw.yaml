# ---- 順位表（get.type: rank。2026.10.20）----
# 件数は、その値で絞り込んだ一覧（list_tab のタブ）へのリンクになる
-   def: gadget
    name: RankCitedCase
    title: 参照されていることが多い判例
    get:
        type: rank
        facet: cited_case
        page_size: 50
        list_tab: 0
        detail: |
            SELECT ?value ?court ?date WHERE {
                $values
                ?value caselawp:id ?id .
                OPTIONAL { ?t a caselawo:Trial ; caselawp:id ?id ; caselawp:court ?court }
                OPTIONAL { ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?date }
            }
    show:
        type: rank
        value_label: 参照されている判例
        label: 参照している判例の数
        chart: bar
        columns:
            - id: court
              label: 裁判所
              display: localname
            - id: date
              label: 判決日
-   def: gadget
    name: RankRefLawCoreClause
    title: 判断の中で参照されていることが多い法令の条
    get:
        type: rank
        facet: reflaw_core_clause
        value_class: lawo:Clause
        # 条の単位だけ数える（law:<法令ID>_<条>。「_<項>」の付いたものは除く）
        value_filter: '!CONTAINS(STRAFTER(STR(?value), "_"), "_")'
        page_size: 50
        list_tab: 0
    show:
        type: rank
        value_label: 法令の条
        label: 判決の数
        chart: bar
-   def: gadget
    name: RankRefLawCore
    title: 判断の中で参照されていることが多い法令
    get:
        type: rank
        facet: reflaw_core
        page_size: 50
        list_tab: 0
    show:
        type: rank
        value_label: 法令
        label: 判決の数
        chart: bar
-   def: gadget
    name: facet_cited_case
    # 本文で引用している判例（データ中の判例に照合できたもの）。順位表の件数のリンクで使う（2026.10.20）
    get:
        type: facet
        name: cited_case
        label: 引用している判例
        predicate: caselawp:citedcaselaw
        value_type: iri
        limit: 30
        search: true
    show:
        type: facet
-   def: gadget
    name: facet_reflaw_core_clause
    # 判断の中で参照している法令の条（reflawCore。法令そのものも値に入るので、順位表では value_class で条に限る）
    get:
        type: facet
        name: reflaw_core_clause
        label: 判断の中で参照している条
        predicate: caselawp:reflawCore
        value_type: iri
        limit: 30
        search: true
    show:
        type: facet
# ---- トピック（2026.10.22。hanrei の src/topics.py、data/csv/topic_def.csv）----
# ---- 争点の名前（同じ名前の争点をまとめる。hanrei の src/issues.py の issues.ttl。2026.11.11）----
-   def: page
    name: IssueName
    type: http://ds.rois.ac.jp/caselaw/ontology/IssueName
    gadget:
        - IssueNameCases
-   def: gadget
    name: IssueNameCases
    title: この名前の争点のある判例（結論は判断の最後の方の言い回しから規則で推定したもの）
    get:
        type: sparql
        src: |
            SELECT ?doc ?dlabel ?date ?no ?outcome ?otext WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?issue caselawp:issueName $uri ; caselawp:issueOf ?doc .
                ?doc rdfs:label ?dlabel .
                OPTIONAL { ?issue caselawp:issueNo ?no }
                OPTIONAL { ?issue caselawp:issueOutcome ?o . ?o rdfs:label ?outcome }
                OPTIONAL { ?issue caselawp:issueOutcomeText ?otext }
                OPTIONAL { ?doc caselawp:id ?id . ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?date }
            }} ORDER BY DESC(?date)
    show:
        type: htable
        columns:
            - id: doc
              type: link
              string: "?dlabel"
              label: 判例
              width: 320
            - id: date
              type: literal
              label: 判決日
              width: 100
            - id: no
              type: literal
              label: 番号
              width: 80
            - id: outcome
              type: literal
              label: 結論（推定）
              width: 90
            - id: otext
              type: literal
              label: 結論の文
              width: 400
-   def: page
    name: IssueNames
    type: collection
    class: caselawo:IssueName
    tabs:
        - label: 一覧
          gadget:
            - IssueNameList
-   def: gadget
    name: IssueNameList
    title: 争点の名前（判例の多い順）
    get:
        type: sparql
        src: |
            SELECT ?entity ?label ?n WHERE {
              $collection
              ?entity rdfs:label ?label .
              OPTIONAL { ?entity caselawp:issueCount ?n }
            } ORDER BY DESC(?n) ?label
    show:
        type: htable
        columns:
            - id: entity
              type: link
              string: "?label"
              label: 争点の名前
              width: 360
            - id: n
              type: literal
              label: 判例
              display: number
              width: 80
-   def: gadget
    name: DocIssues
    # 判決文書に付く。裁判・判決のページからは caselawp:id で判決文書へたどる（Keyword と同じ）。
    # 本文へ = その争点を判断した最初の段落へ飛ぶリンク（テキストフラグメント #:~:text=。hanrei の src/issues.py）
    title: 争点（判断の有無、本文の判断の箇所、結論、その争点に特有の語。結論は判断の最後の方の言い回しから推定したもので、取消事由はよく当たるが、ほかの争点は結論の文と一緒に見る）
    get:
        type: sparql
        src: |
            # 1行 = 争点 × 特有の語（表示は group_by: issue で争点ごとに1行にまとめ、語はタームのページへのリンクにする。2026.10.23）
            SELECT ?issue ?no ?label ?iname ?headnote ?judged ?jump ?outcome ?otext ?t ?tu WHERE {
            {
            SELECT ?issue ?label (SAMPLE(?n0) AS ?no) (SAMPLE(?nm) AS ?iname) (SAMPLE(?j) AS ?judged) (SAMPLE(?link) AS ?jump)
                   (SAMPLE(?o2) AS ?outcome) (SAMPLE(?ot) AS ?otext) (SAMPLE(?hn) AS ?headnote) WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument ; caselawp:id ?id ; caselawp:year ?year ; caselawp:issue ?issue .
                ?issue rdfs:label ?label .
                OPTIONAL { ?issue caselawp:issueNo ?n0 }
                OPTIONAL { ?issue caselawp:issueName ?nm }   # 争点の名前（同じ名前の争点のある判例へ。2026.11.11）
                OPTIONAL { ?issue caselawp:judged ?jb }
                BIND(IF(COALESCE(?jb, false), "判断あり", "判断なし") AS ?j)
                OPTIONAL { ?issue caselawp:judgmentStart ?start }
                BIND(IF(BOUND(?start), CONCAT("/data/", STR(?year), "/", STR(?id), "_hanrei.html#:~:text=", REPLACE(ENCODE_FOR_URI(STR(?start)), "-", "%2D")), ?unbound) AS ?link)   # 「-」はテキストフラグメントの区切りなので %2D に
                OPTIONAL { ?issue caselawp:issueOutcome ?o . ?o rdfs:label ?ol .
                           OPTIONAL { ?issue caselawp:issueOutcomeSource ?osrc } }
                # 結論の出どころ（「判決の結果」）はデータの文字列を使う。Virtuoso は問い合わせの中の CONCAT に入れた全角の文字列を化けさせる
                BIND(IF(BOUND(?ol), CONCAT(STR(?ol), IF(BOUND(?osrc), CONCAT(" (", STR(?osrc), ")"), "")), ?unbound) AS ?o2)
                OPTIONAL { ?issue caselawp:issueOutcomeText ?ot }
                OPTIONAL { ?issue caselawp:issueHeadnote ?hn }   # 最高裁の判決: 判示事項の項目（2026.10.23）
            }} GROUP BY ?issue ?label
            }
            OPTIONAL { graph <http://ds.rois.ac.jp/caselaw/> { ?issue caselawp:issueTerm ?t .
                       OPTIONAL { ?tu rdfs:label ?t ; a caselawo:Term } } }
            } ORDER BY STRLEN(STR(?issue)) ?issue
    show:
        type: htable
        group_by: issue
        columns:
            - id: no
              type: literal
              label: 番号
              width: 80
            - id: label
              type: literal
              label: 争点
              width: 260
            - id: iname
              type: link
              string: "同じ争点の判例"
              label: 同じ名前の争点
              width: 110
            - id: headnote
              type: literal
              label: 判示事項（最高裁）
              width: 300
            - id: judged
              type: literal
              label: 判断
              width: 70
            - id: jump
              type: directlink
              string: "本文の判断へ"
              label: 本文
              width: 90
            - id: outcome
              type: literal
              label: 結論（規則で推定）
              width: 110
            - id: otext
              type: literal
              label: 結論の文
              width: 360
            - id: tu
              type: link
              string: "?t"
              label: その争点に特有の語（タームのページへ）
              width: 260
-   def: gadget
    name: DocTopics
    title: トピック
    get:
        type: sparql
        src: |
            SELECT ?topic ?label ?core WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument ; caselawp:id ?id ; caselawp:topic ?topic . ?topic rdfs:label ?label .
                OPTIONAL { ?docid caselawp:topicCore ?topic . BIND("強・中" AS ?k) }
                OPTIONAL { ?docid caselawp:topicByCitation ?topic . BIND("引用" AS ?ci) }
                OPTIONAL { ?docid caselawp:topicByAppeal ?topic . BIND("審級" AS ?ap) }
                BIND(IF(BOUND(?ci) || BOUND(?ap), CONCAT("広げた（", COALESCE(?ci, ""), IF(BOUND(?ci) && BOUND(?ap), "・", ""), COALESCE(?ap, ""), "）"), "") AS ?ex)
                BIND(IF(BOUND(?k), "強・中", IF(?ex != "", ?ex, "弱")) AS ?core)
            }}
    show:
        type: htable
        columns:
            - id: topic
              type: link
              string: "?label"
              label: トピック
              width: 260
            - id: core
              type: literal
              label: 確かさ
              width: 80
#   トピック = 条・法令・概念の語・事件名の語の組。判例はそのどれかでトピックに入る（caselawp:topic）。
#   確かさが「強・中」のもの（条と語の両方、事件名、条だけ、語が5回以上）は caselawp:topicCore
-   def: gadget
    name: TopicDefinition
    title: トピックの定め方
    get:
        type: sparql
        src: |
            SELECT ?kind ?value ?label ?word ?wlink WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { $uri caselawp:topicClause ?value . BIND("条" AS ?kind) OPTIONAL { ?value rdfs:label ?label } }
                UNION { $uri caselawp:topicLaw ?value . BIND("法令" AS ?kind) OPTIONAL { ?value rdfs:label ?label } }
                UNION { $uri caselawp:topicWord ?word . BIND("概念の語" AS ?kind)
                        OPTIONAL { ?term rdfs:label ?word ; a caselawo:Term } }
                UNION { $uri caselawp:topicCasenameWord ?word . BIND("事件名の語" AS ?kind)
                        OPTIONAL { ?term rdfs:label ?word ; a caselawo:Term } }
                UNION { $uri caselawp:topicPartyWord ?word . BIND("当事者の語（概念の語と一緒で強）" AS ?kind)
                        OPTIONAL { ?term rdfs:label ?word ; a caselawo:Term } }
                # 語のリンク: その語をラベルに持つターム（リンク用のターム・論点キーワード）があればそのページ、無ければ語での検索
                # （Virtuoso は BIND の中の IF(EXISTS {…}) を受け付けないので、ラベルで突き合わせる）
                BIND(IF(BOUND(?term), CONCAT("/resource?uri=", ENCODE_FOR_URI(STR(?term))),
                        IF(BOUND(?word), CONCAT("/search?q=", ENCODE_FOR_URI(STR(?word)), "&mode=partial"), ?unbound)) AS ?wlink)
            }}
    show:
        type: htable
        columns:
            - id: kind
              type: literal
              label: 種類
              width: 100
            - id: value
              type: link
              string: "?label"
              label: 条・法令
              width: 260
            - id: wlink
              type: directlink
              string: "?word"
              label: 語（タームのページ、無ければ語で検索）
              width: 220
# トピックの階層（skos:broader。下位のトピックの判例は上位のトピックの判例に限る）
-   def: gadget
    name: FieldInfo
    title: 分野
    get:
        type: sparql
        src: |
            select ?label ?level ?parent ?parentlabel ?scheme where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:label ?label .
                OPTIONAL { $uri skos:notation ?level }
                OPTIONAL { $uri skos:broader ?parent . OPTIONAL { ?parent rdfs:label ?parentlabel } }
                OPTIONAL { $uri skos:inScheme ?s . ?s rdfs:label ?scheme }
            }} limit 1
    show:
        type: vtable
        columns:
            - id: label
              label: 分野
              width: 120
            - id: level
              label: 分類の段階
            - id: parentlabel
              label: 上位の分野
              link: parent
            - id: scheme
              label: 分類の体系
-   def: gadget
    name: FieldHierarchy
    title: 上位・下位の分野
    # 下位の分野の判例の数は、さらに下位の分野の判例も含める（skos:broader をたどる）
    get:
        type: sparql
        src: |
            SELECT ?rel ?f ?label (COUNT(DISTINCT ?doc) AS ?n) WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { $uri skos:broader ?f . BIND("上位" AS ?rel) BIND(0 AS ?ord) }
                UNION { ?f skos:broader $uri . BIND("下位" AS ?rel) BIND(1 AS ?ord) }
                UNION { $uri skos:broader ?p . ?f skos:broader ?p . FILTER(?f != $uri) BIND("同じ上位の分野" AS ?rel) BIND(2 AS ?ord) }
                ?f rdfs:label ?label .
                # 人手（legalfield）と規則（legalfieldByRule。事件名・事案キーワード・権利種別。2026.11.8）で付けた判例
                OPTIONAL { ?sub skos:broader* ?f . ?doc caselawp:legalfield|caselawp:legalfieldByRule ?sub }
            }} GROUP BY ?ord ?rel ?f ?label ORDER BY ?ord ?label
    show:
        type: htable
        columns:
            - id: rel
              type: literal
              label: 関係
              width: 120
            - id: f
              type: link
              string: "?label"
              label: 分野
              width: 260
            - id: n
              type: literal
              label: 判例
              width: 80
-   def: gadget
    name: CaseLawInThisField
    title: この分野（下位の分野を含む）の判例（人手で付けたもの、規則で付けたもの。新しい順）
    collection:
        title: この分野の判決文書
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        page_size: 50
        src: |
            # 規則（legalfieldByRule）は、事件名・事案キーワード・権利種別から付けたもの（hanrei の src/field.py。2026.11.8）
            select ?doc ?label ?f ?flabel ?how ?date where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?f skos:broader* $uri .
                { ?doc caselawp:legalfield ?f . BIND("人手" AS ?how) }
                UNION { ?doc caselawp:legalfieldByRule ?f . FILTER NOT EXISTS { ?doc caselawp:legalfield ?f } BIND("規則" AS ?how) }
                ?doc rdfs:label ?label .
                ?f rdfs:label ?flabel .
                OPTIONAL { ?doc caselawp:id ?id . ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?date }
            }} order by desc(?date)
    show:
        type: htable
        columns:
            - id: label
              label: 判例（事件名）
              link: doc
              width: 320
            - id: date
              label: 判決日
              width: 90
            - id: f
              type: link
              string: "?flabel"
              label: 分野
              width: 220
            - id: how
              type: literal
              label: 付け方
              width: 60
# 分野とトピックの対応（hanrei の topic_def.csv の「分野」「対応する分野」。topics.py が caselawp:topicField・skos:relatedMatch にする。2026.11.5）
-   def: gadget
    name: FieldTopics
    title: この分野（下位の分野を含む）のトピック
    get:
        type: sparql
        src: |
            SELECT ?t ?tlabel ?rel ?f ?flabel (COUNT(DISTINCT ?doc) AS ?n) WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?f skos:broader* $uri .
                { ?t caselawp:topicAxis ?f . BIND("軸" AS ?rel) BIND(-1 AS ?ord) }
                UNION { ?t caselawp:topicField ?f . FILTER NOT EXISTS { ?t caselawp:topicAxis ?f } BIND("分野" AS ?rel) BIND(0 AS ?ord) }
                UNION { ?t skos:relatedMatch ?f . FILTER NOT EXISTS { ?t caselawp:topicField ?f } BIND("対応する分野" AS ?rel) BIND(1 AS ?ord) }
                ?t a caselawo:Topic ; rdfs:label ?tlabel .
                ?f rdfs:label ?flabel .
                OPTIONAL { ?doc caselawp:topicCore ?t }
            }} GROUP BY ?ord ?t ?tlabel ?rel ?f ?flabel ORDER BY ?ord ?tlabel
    show:
        type: htable
        columns:
            - id: t
              type: link
              string: "?tlabel"
              label: トピック
              width: 220
            - id: rel
              type: literal
              label: 対応
              width: 100
            - id: f
              type: link
              string: "?flabel"
              label: 分野
              width: 220
            - id: n
              type: literal
              label: 判例（強・中）
              width: 100
-   def: gadget
    name: CaseLawInThisFieldByTopic
    title: トピックから分野を付けた判例（この分野・下位の分野。人手で付けた分野の判例とは別）
    collection:
        title: トピックから分野を付けた判決文書
        var: doc
        class: caselawo:CaseLawDocument
        label: 判決文書をコレクションとして表示
    get:
        type: sparql
        page_size: 50
        src: |
            SELECT ?doc ?label ?f ?flabel ?date ?tagged WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?f skos:broader* $uri .
                ?doc caselawp:legalfieldByTopic ?f ; rdfs:label ?label .
                ?f rdfs:label ?flabel .
                OPTIONAL { ?doc caselawp:legalfield ?g . ?g skos:broader* $uri . BIND("付いている" AS ?tg) }
                BIND(COALESCE(?tg, "") AS ?tagged)
                OPTIONAL { ?doc caselawp:id ?id . ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?date }
            }} ORDER BY DESC(?date)
    show:
        type: htable
        columns:
            - id: doc
              type: link
              string: "?label"
              label: 判例（事件名）
              width: 320
            - id: f
              type: link
              string: "?flabel"
              label: 分野
              width: 220
            - id: tagged
              type: literal
              label: 人手の分野
              width: 90
            - id: date
              type: literal
              label: 判決日
              width: 100
-   def: gadget
    name: TopicField
    title: このトピックの軸・分野
    get:
        type: sparql
        src: |
            # 軸 = topic_def.csv の「軸」（法的論点か分野。2026.11.8）。分野 = 判例に分野を付けるのに使う分野
            SELECT ?rel ?f ?label WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { $uri skos:exactMatch ?f . BIND("軸（同じ範囲）" AS ?rel) BIND(-2 AS ?ord) }
                UNION { $uri skos:broadMatch ?f . BIND("軸（この下位）" AS ?rel) BIND(-1 AS ?ord) }
                UNION { $uri caselawp:topicField ?f . BIND("分野" AS ?rel) BIND(0 AS ?ord) }
                UNION { $uri skos:relatedMatch ?f . FILTER NOT EXISTS { $uri caselawp:topicField ?f } BIND("対応する分野" AS ?rel) BIND(1 AS ?ord) }
                ?f rdfs:label ?label .
            }} ORDER BY ?ord ?label
    show:
        type: htable
        columns:
            - id: rel
              type: literal
              label: 対応
              width: 120
            - id: f
              type: link
              string: "?label"
              label: 軸の概念・分野
              width: 300
-   def: gadget
    name: TopicHierarchy
    title: 上位・下位のトピック
    get:
        type: sparql
        src: |
            SELECT ?rel ?t ?label (COUNT(DISTINCT ?doc) AS ?n) WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { $uri skos:broader ?t . BIND("上位" AS ?rel) BIND(0 AS ?ord) }
                UNION { ?t skos:broader $uri . BIND("下位" AS ?rel) BIND(1 AS ?ord) }
                UNION { $uri skos:broader ?p . ?t skos:broader ?p . FILTER(?t != $uri) BIND("同じ上位の下位" AS ?rel) BIND(2 AS ?ord) }
                ?t rdfs:label ?label .
                OPTIONAL { ?doc caselawp:topicCore ?t }
            }} GROUP BY ?ord ?rel ?t ?label ORDER BY ?ord ?label
    show:
        type: htable
        columns:
            - id: rel
              type: literal
              label: 関係
              width: 120
            - id: t
              type: link
              string: "?label"
              label: トピック
              width: 260
            - id: n
              type: literal
              label: 判例（強・中）
              width: 100
-   def: gadget
    name: CaseLawInThisTopic
    title: このトピックの判例（確かさ 強・中、引用・審級で広げたもの、弱 の順。その中は新しい順）
    collection:
        class: caselawo:CaseLawDocument
        facet: topic
        label: このトピックの判決文書をコレクションとして表示（ほかの絞り込みと組み合わせられる）
    get:
        type: sparql
        page_size: 50
        src: |
            SELECT ?doc ?label ?date ?how ?core WHERE {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?doc caselawp:topic $uri ; rdfs:label ?label .
                OPTIONAL { ?doc caselawp:topicByLaw $uri . BIND("条" AS ?l) }
                OPTIONAL { ?doc caselawp:topicByWord $uri . BIND("語" AS ?w) }
                OPTIONAL { ?doc caselawp:topicByCasename $uri . BIND("事件名" AS ?c) }
                OPTIONAL { ?doc caselawp:topicByParty $uri . BIND("・当事者" AS ?pt) }
                OPTIONAL { ?doc caselawp:topicByCitation $uri . BIND("引用" AS ?ci) }
                OPTIONAL { ?doc caselawp:topicByAppeal $uri . BIND("審級" AS ?ap) }
                BIND(BOUND(?l) || BOUND(?w) || BOUND(?c) AS ?base)
                OPTIONAL { ?doc caselawp:topicCore $uri . BIND("強・中" AS ?k) }
                BIND(CONCAT(COALESCE(?l, ""), IF(BOUND(?l) && (BOUND(?w) || BOUND(?c)), "・", ""), COALESCE(?w, ""), COALESCE(?pt, ""), IF(BOUND(?w) && BOUND(?c), "・", ""), COALESCE(?c, ""),
                            IF(?base && (BOUND(?ci) || BOUND(?ap)), "（広げた: ", IF(BOUND(?ci) || BOUND(?ap), "広げた: ", "")),
                            COALESCE(?ci, ""), IF(BOUND(?ci) && BOUND(?ap), "・", ""), COALESCE(?ap, ""),
                            IF(?base && (BOUND(?ci) || BOUND(?ap)), "）", "")) AS ?how)
                BIND(IF(BOUND(?k), "強・中", IF(BOUND(?ci) || BOUND(?ap), "広げた", "弱")) AS ?core)
                BIND(IF(BOUND(?k), 0, IF(BOUND(?ci) || BOUND(?ap), 1, 2)) AS ?ord)
                OPTIONAL { ?doc caselawp:id ?id . ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?date }
            }} ORDER BY ?ord DESC(?date)
    show:
        type: htable
        columns:
            - id: doc
              type: link
              string: "?label"
              label: このトピックの判例
              width: 320
            - id: how
              type: literal
              label: 手がかり
              width: 160
            - id: core
              type: literal
              label: 確かさ
              width: 60
            - id: date
              type: literal
              label: 判決日
              width: 100
-   def: page
    name: Topics
    type: collection
    class: caselawo:Topic
    sidebar:
        - facet_topic_axis
    tabs:
        - label: 一覧
          gadget:
            - TopicList
-   def: gadget
    name: TopicList
    title: トピック（軸の概念の判例を、条・語・事件名の手がかりを詰めて集めたもの）
    get:
        type: sparql
        src: |
            # 軸（法的論点・分野）→ 大分類 → 上位のトピック → トピックの順に並べる（2026.11.8）
            SELECT ?entity ?label ?scheme ?glabel ?axis ?alabel ?rel ?parent ?plabel ?ns ?nm ?nw ?ev WHERE {
              $collection
              ?entity rdfs:label ?label .
              # OPTIONAL はどれも ?entity から始める（他の OPTIONAL の変数から始めると、Virtuoso では束縛されないまま全件と組になる）
              OPTIONAL { ?entity caselawp:topicAxis ?axis . ?axis rdfs:label ?alabel .
                         ?axis skos:broader* ?top . ?top skos:topConceptOf ?sch ; rdfs:label ?glabel . ?sch rdfs:label ?scheme }
              OPTIONAL { ?entity skos:broadMatch ?bm }
              BIND(IF(BOUND(?bm), "下位", IF(BOUND(?axis), "同じ", "")) AS ?rel)
              OPTIONAL { ?entity skos:broader ?parent . ?parent rdfs:label ?plabel }
              OPTIONAL { ?entity caselawp:topicStrongCount ?ns }
              OPTIONAL { ?entity caselawp:topicMiddleCount ?nm }
              OPTIONAL { ?entity caselawp:topicWeakCount ?nw }
              OPTIONAL { ?entity caselawp:topicEvaluation ?ev }
            } ORDER BY DESC(?scheme) ?glabel COALESCE(?plabel, ?label) BOUND(?parent) ?label
    show:
        type: htable
        group_by: entity
        columns:
            - id: scheme
              type: literal
              label: 軸
              width: 90
            - id: glabel
              type: literal
              label: 大分類
              width: 110
            - id: entity
              type: link
              string: "?label"
              label: トピック
              width: 230
            - id: axis
              type: link
              string: "?alabel"
              label: 対応する軸の概念
              width: 200
            - id: rel
              type: literal
              label: 範囲
              width: 50
            - id: parent
              type: link
              string: "?plabel"
              label: 上位のトピック
              width: 130
            - id: ns
              type: literal
              label: 強
              display: number
              width: 60
            - id: nm
              type: literal
              label: 中
              display: number
              width: 60
            - id: nw
              type: literal
              label: 弱
              display: number
              width: 60
            - id: ev
              type: literal
              label: 答え合わせ
              width: 200
-   def: gadget
    name: facet_topic_axis
    get:
        type: facet
        name: topic_axis
        label: 対応する軸の概念（上位を含む）
        predicate: caselawp:topicAxis/skos:broader*
        value_type: iri
        limit: 30
    show:
        type: facet
# ---- 個別意見のコレクション（2026.10.20）----
-   def: page
    name: SeparateOpinions
    type: collection
    class: caselawo:SeparateOpinion
    sidebar:
        - facet_op_kind
        - facet_op_author
    tabs:
