-   def: gadget
    name: CaseLawFromThisSource
    # この出典の判決文書（件数と年の範囲）。コレクションへ
    collection:
        facet: source
        class: caselawo:CaseLawDocument
        label: この出典の判決文書をコレクションとして表示
    get:
        type: sparql
        src: |
            select (count(?doc) as ?n) (min(?year) as ?from) (max(?year) as ?to) where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?doc dcterms:source $uri .
                OPTIONAL {?doc caselawp:year ?year}
            }}
    show:
        type: vtable
        columns:
            - id: n
              label: 判決文書の数
            - id: from
              label: 最も古い年
            - id: to
              label: 最も新しい年
