-   def: gadget
    name: SimilarCaseLaw
    # 類似判例（src/embed.py --task ttl の similar.ttl。中労委と hanrei）。裁判・判決・判決文書のページから caselawp:id でたどる
    # 共通点: 中労委は共通の判示事項、hanreiは共通の参照判例(caselawp:sharedCitedCaseLaw)と参照法令の条(caselawp:sharedRefLaw)
    collection:
        title: 類似判例
        var: doc
        class: caselawo:CaseLawDocument
        label: 類似判例をコレクションとして表示
    get:
        type: sparql
        src: |
            select ?rank ?doc ?label (group_concat(distinct ?tl; separator=" / ") as ?shared) where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?self a caselawo:CaseLawDocument ;
                      caselawp:id ?id ;
                      caselawp:similar ?s .
                ?s caselawp:similarDocument ?doc ;
                   caselawp:rank ?rank .
                ?doc rdfs:label ?label .
                OPTIONAL {
                    ?s churoip:共通の判示事項|caselawp:sharedCitedCaseLaw|caselawp:sharedRefLaw ?t .
                    ?t rdfs:label ?tl .
                }
            }} group by ?rank ?doc ?label order by ?rank
    show:
        type: htable
        columns:
            - id: rank
              label: 順位
              width: 40
            - id: label
              label: 類似判例（同じ紛争の判例を除く）
              link: doc
              width: 300
            - id: shared
              label: 共通の判示事項・参照判例・参照法令
              width: 200
-   def: gadget
    name: Proceeding
    # 顛末（同じ紛争の命令・判決）。中労委の判例だけ
    get:
        type: sparql
        src: |
            select ?p ?label ?date ?kind where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri churoip:proceeding ?p .
                ?p rdfs:label ?label .
                OPTIONAL {?p churoip:orderdate ?date}
                OPTIONAL {?p churoip:区分 ?kind}
                OPTIONAL {?p caselawp:decision/caselawp:judgmentdate ?date}
            }} order by ?date
    show:
        type: htable
        columns:
            - id: date
              label: 年月日
              width: 90
            - id: label
              label: 顛末（同じ紛争の命令・判決）
              link: p
              width: 300
            - id: kind
              label: 命令区分
              width: 150
-   def: gadget
    name: CaseLawWithThisTopic
    # この判示事項（中労委の分類）の判決文書
    # 中労委の判例のコレクション（ChuroiCaseLaw）を、この判示事項で絞り込んで表示する（他の判示事項や裁判所などと組み合わせられる）
    collection:
        facet: churoi_topic
        view: ChuroiCaseLaw
        label: 中労委の判例のコレクションで表示
    get:
        type: sparql
        src: |
            select distinct ?doc ?label ?date where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?j churoip:判示事項 $uri ;
                   caselawp:id ?id .
                OPTIONAL {?j caselawp:judgmentdate ?date}
                ?doc a caselawo:CaseLawDocument ;
                     caselawp:id ?id ;
