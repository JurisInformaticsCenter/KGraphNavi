    get:
        type: sparql
        page_size: 50
        src: |
            SELECT ?entity ?label ?kind ?author ?doc ?date WHERE {
                $collection
                ?entity rdfs:label ?label .
                OPTIONAL { ?entity caselawp:opinionKind ?kind }
                OPTIONAL { ?entity caselawp:author ?author }
                OPTIONAL { ?entity caselawp:id ?id . ?doc a caselawo:CaseLawDocument ; caselawp:id ?id .
                           OPTIONAL { ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?date } }
