-   def: gadget
    name: RefCase
    # 本文で参照している事件(refcase.ttl の caselawp:refcase)。裁判所が分かれば事件(caselawo:Case)、分からなければ事件番号(caselawo:CaseNumber)。
    # データ中の判例に照合できたもの(caselawp:citedcaselaw)はその判例へもリンクする(2026.10.18)
    get:
        type: sparql
        src: |
            select distinct ?ref ?reflabel ?kind ?cited ?citedlabel where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id ; caselawp:refcase ?ref .
                ?ref rdfs:label ?reflabel .
                FILTER (!STRSTARTS(STR(?reflabel), "C"))
                OPTIONAL {?ref a ?type . FILTER (?type IN (caselawo:Case, caselawo:CaseNumber))}
                BIND (IF(COALESCE(?type = caselawo:Case, false), "事件（裁判所＋事件番号）", "事件番号") AS ?kind)
                OPTIONAL {
                    ?docid caselawp:citedcaselaw ?cited .
                    ?cited caselawp:id ?cid .
                    ?ct a caselawo:Trial ; caselawp:id ?cid ; caselawp:case ?ccase .
                    FILTER (?ccase = ?ref || EXISTS {?ccase caselawp:casenumber ?ref})
                    ?cited rdfs:label ?citedlabel .
                }
            }} order by ?reflabel
    show:
        type: htable
        columns:
            - id: reflabel
              label: 本文で参照している事件
              link: ref
              width: 200
            - id: kind
              label: 結び先
              width: 140
            - id: citedlabel
              label: データ中の判例
              link: cited
              width: 300
-   def: gadget
    name: Patent
    get:
        type: sparql
        src: |
            select ?patent ?label ?title where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri caselawp:id ?id .
                ?docid a caselawo:CaseLawDocument; caselawp:id ?id .
                ?docid caselawp:refpatent ?patent .
                ?patent rdfs:label ?label.
                OPTIONAL {?patent dc:title ?title}
            }}
    show: 
        type: htable
        columns:
            # 特許のページへ(2026.10.18。裁判・判決・判決文書のページに出す)
            - id: label
              label: 参照特許
              link: patent
              width: 120
            - id: title
              label: 発明の名称
              width: 300
-   def: gadget
    name: TermRelation
    # 上位・下位・関連のターム（hanrei の src/keywords.py の keywords.ttl。2026.10.17）。
    # 複合語の後ろの部分を上位とする（起訴休職→休職）。「AのB」は B が上位、A が関連（裁量権の濫用→濫用、関連 裁量権）
    get:
        type: sparql
        src: |
            select ?rel ?term where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                { $uri skos:broader ?term . BIND("上位" AS ?rel) }
                UNION { ?term skos:broader $uri . BIND("下位" AS ?rel) }
                UNION { $uri skos:related ?term . BIND("関連" AS ?rel) }
                UNION { ?term skos:related $uri . BIND("関連" AS ?rel) }
            }} order by desc(?rel) ?term
    show:
        type: htable
        columns:
            - id: rel
              label: 関係
              width: 60
            - id: term
              label: ターム
              type: link
              display: localname
              width: 250
-   def: gadget
    name: CaseLawWithThisKeyword
    # このターム、またはその下位のターム（skos:broader をたどる）をキーワードに持つ判例（2026.10.17）
    get:
        type: sparql
        src: |
            select ?kind ?term ?doc ?label where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                ?term skos:broader* $uri .
                { ?doc caselawp:論点キーワード ?term . BIND("論点" AS ?kind) }
                UNION { ?doc caselawp:事案キーワード ?term . BIND("事案" AS ?kind) }
                ?doc rdfs:label ?label .
            }} order by ?term ?label
    show:
        type: htable
        columns:
            - id: kind
              label: 種類
              width: 50
            - id: term
              label: キーワード
              type: link
              display: localname
              width: 180
            - id: label
              label: この語（下位の語を含む）をキーワードに持つ判例
              link: doc
              width: 300
-   def: gadget
