                OPTIONAL {$uri rdfs:comment ?abstract}
            }}
    show: 
        type: vtable
        columns:
            - id: label
              label: 名称
              width: 100
            - id: sameas
              label: リンク
              type: directlink
            - id: abstract
              label: 説明
