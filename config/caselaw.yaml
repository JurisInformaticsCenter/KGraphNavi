# ---------------------------------------------------------------- PDFの状況のコレクション（2026.10.7）
#   /collection?view=PdfStatus。要素はPDFの情報（ページ数）のある判決文書（裁判所の判例）
#   PDFの情報は hanrei の pdf_metadata.ttl（ステップ5・6-2・7）：ページ数 dcterms:extent、作成・更新日 prism:creationDate / modificationDate、
#   作成ツール caselawp:pdfProducerTool / pdfCreatorTool、テキストの取り出し方 caselawp:pdfTextExtraction（通常の取り出し方のときは値が無い）、
#   画像だけのページ数 caselawp:pdfImagePages、OCRで入れたページ数 caselawp:pdfOcrPages、文書の特徴 caselawp:pdfFeature（caselawo:PDF特徴_…）
-   def: page
    name: PdfStatus
    type: collection
    query: |
        SELECT ?uri
        WHERE {
            ?uri a caselawo:CaseLawDocument ;
                 dcterms:extent ?npages .
        }
    sidebar:
        - facet_pdf_defect
        - facet_pdf_text_method
        - facet_pdf_feature
        - facet_pdf_npages
        - facet_pdf_image_pages
        - facet_pdf_ocr_pages
        - facet_pdf_producer
        - facet_pdf_creator
        - facet_pdf_created
        - facet_year
    tabs:
        - label: 一覧
          gadget:
            - PdfDocumentList
        - label: テキストの取り出し方
          gadget:
            - PdfTextMethodPie
            - PdfTextMethodTable
        - label: 文書の特徴
          gadget:
            - PdfFeatureBar
            - PdfFeatureTable
        - label: ページ数
          gadget:
            - PageFrequencyDistributionBar
            - PageFrequencyDistribution
        - label: 作成ツール
          gadget:
            - PdfProducerTable
            - PdfCreatorTable
        - label: PDFの作成年
          gadget:
            - PdfCreatedYearBar
-   def: gadget
    name: PdfDocumentList
    title: 判決文書のPDF
    get:
        type: sparql
        page_size: 50
        src: |
            SELECT ?entity ?id ?year ?npages ?method ?image ?ocr ?featurelabel ?producer ?created
            WHERE {
                $collection
                ?entity caselawp:id ?id .
                OPTIONAL { ?entity caselawp:year ?year }
                OPTIONAL { ?entity dcterms:extent ?npages }
                OPTIONAL { ?entity caselawp:pdfTextExtraction ?method }
                OPTIONAL { ?entity caselawp:pdfImagePages ?image }
                OPTIONAL { ?entity caselawp:pdfOcrPages ?ocr }
                OPTIONAL { ?entity caselawp:pdfFeature ?feature .
                           OPTIONAL { ?feature rdfs:label ?featurelabel } }
                OPTIONAL { ?entity caselawp:pdfProducerTool ?producer }
                OPTIONAL { ?entity prism:creationDate ?created }
            }
    show:
        type: htable
        group_by: entity
        columns:
            - id: entity
              type: link
              string: "?id"
              label: ID
              width: 80
            - id: year
              label: 年
              width: 50
            - id: npages
              label: ページ数
              width: 60
            - id: method
              label: 取り出し方
              width: 90
              collection:
                  view: PdfStatus
                  facet: pdf_text_method
            - id: image
              label: 画像ページ
              width: 60
            - id: ocr
              label: OCRページ
              width: 60
            - id: featurelabel
              label: 文書の特徴
              width: 200
            - id: producer
              label: 作成ツール
              width: 220
              collection:
                  view: PdfStatus
                  facet: pdf_producer
            - id: created
              label: PDFの作成日
              width: 90
# テキストの取り出し方（値の無いものは通常の取り出し方 normal として数える）
-   def: gadget
    name: PdfTextMethodPie
    title: テキストの取り出し方
    get:
        type: sparql
        src: |
            SELECT ?method (COUNT(?entity) AS ?count)
            WHERE {
                $collection
                OPTIONAL { ?entity caselawp:pdfTextExtraction ?m }
                BIND(COALESCE(?m, "normal") AS ?method)
            }
            GROUP BY ?method
            ORDER BY DESC(?count)
    show:
        type: chart
        chart: pie
        labels: method
        dataset: count
-   def: gadget
    name: PdfTextMethodTable
    title: テキストの取り出し方（normal：通常、all-texts：図の中の文字も取り出した、ocr：全体をOCR、ocr-pages：一部のページをOCR、empty：文字が無い）
    get:
        type: sparql
        src: |
            SELECT ?method (COUNT(?entity) AS ?count) (SUM(COALESCE(?image, 0)) AS ?images) (SUM(COALESCE(?ocr, 0)) AS ?ocrs)
            WHERE {
                $collection
                OPTIONAL { ?entity caselawp:pdfTextExtraction ?m }
                OPTIONAL { ?entity caselawp:pdfImagePages ?image }
                OPTIONAL { ?entity caselawp:pdfOcrPages ?ocr }
                BIND(COALESCE(?m, "normal") AS ?method)
            }
            GROUP BY ?method
            ORDER BY DESC(?count)
    show:
        type: htable
        columns:
            - id: method
              label: 取り出し方
              width: 120
              collection:
                  view: PdfStatus
                  facet: pdf_text_method
            - id: count
              label: 文書数
              width: 80
            - id: images
              label: 画像ページの数
              width: 100
            - id: ocrs
              label: OCRで入れたページの数
              width: 140
-   def: gadget
    name: PdfFeatureBar
    title: 文書の特徴（logicalhtmlが行った特別な処理）
    get:
        type: sparql
        src: |
            SELECT ?label (COUNT(DISTINCT ?entity) AS ?count)
            WHERE {
                $collection
                ?entity caselawp:pdfFeature ?feature .
                OPTIONAL { ?feature rdfs:label ?l }
                BIND(COALESCE(STR(?l), REPLACE(STR(?feature), "^.*PDF特徴_", "")) AS ?label)
            }
            GROUP BY ?label
            ORDER BY DESC(?count)
    show:
        type: chart
        chart: bar
        labels: label
        dataset: count
-   def: gadget
    name: PdfFeatureTable
    title: 文書の特徴
    get:
        type: sparql
        src: |
            SELECT ?feature ?label ?comment (COUNT(DISTINCT ?entity) AS ?count)
            WHERE {
                $collection
                ?entity caselawp:pdfFeature ?feature .
                OPTIONAL { ?feature rdfs:label ?label }
                OPTIONAL { ?feature rdfs:comment ?comment }
            }
            GROUP BY ?feature ?label ?comment
            ORDER BY DESC(?count)
    show:
        type: htable
        columns:
            - id: label
              label: 特徴
              width: 140
              collection:
                  view: PdfStatus
                  facet: pdf_feature
                  value: feature
            - id: count
              label: 文書数
              width: 80
            - id: comment
              label: 説明
              width: 480
-   def: gadget
    name: PdfProducerTable
    title: PDFの作成ツール（Producer）
