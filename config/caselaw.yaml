# ---------------------------------------------------------------- 問題のあるPDFのコレクション（2026.11.8）
#   /collection?view=PdfProblems。要素はPDF化の誤りのある判決文書（hanrei の src/pdfdefects.py の pdfdefects.ttl）
#   PDF化の誤り caselawp:pdfDefect（caselawo:PDF誤り_…: 画像になった文字・中黒の番号・行頭の中黒・表せない文字・CIDのままの文字・外字・読み誤り）、
#   種類ごとの件数と例 caselawp:pdfDefectDetail [ caselawp:defectType ; caselawp:defectCount ; caselawp:defectExample ]
-   def: page
    name: PdfProblems
    type: collection
    query: |
        SELECT DISTINCT ?uri
        WHERE {
            ?uri a caselawo:CaseLawDocument ;
                 caselawp:pdfDefect ?defect .
        }
    sidebar:
        # PDF化の誤りと文書の特徴（分離文字列・画像の文字・重ね打ち・罫線の表など）は似た性質なので並べる（2026.11.11）
        - facet_pdf_defect
        - facet_pdf_feature
        - facet_pdf_producer
        - facet_pdf_creator
        - facet_pdf_created
        - facet_pdf_text_method
        - facet_doc_court
        - facet_year
    tabs:
        - label: 一覧
          gadget:
            - PdfProblemList
        - label: 問題別
          lazy: true
          gadget:
            - PdfDefectBar
            - PdfDefectTable
        - label: 作成ツール別
          lazy: true
          gadget:
            - PdfDefectByProducer
            - PdfDefectByCreator
        - label: PDFの作成年別
          lazy: true
          gadget:
            - PdfDefectByCreatedYear
-   def: gadget
    name: facet_pdf_defect
    get:
        type: facet
        name: pdf_defect
        label: PDF化の誤り
        predicate: caselawp:pdfDefect
        value_type: iri
        label_predicate: rdfs:label
    show:
        type: facet
-   def: gadget
    name: PdfProblemList
    title: 問題のあるPDF（種類ごとの件数と例。例の〓は読めなかった字、〔 〕はOCRで読んだ字）
    get:
        type: sparql
        page_size: 50
        src: |
            SELECT ?entity ?id ?label ?year ?kind ?n ?example ?features ?producer ?creator
            WHERE {
                $collection
                ?entity caselawp:id ?id ; rdfs:label ?label .
                OPTIONAL { ?entity caselawp:year ?year }
                ?entity caselawp:pdfDefectDetail ?d .
                ?d caselawp:defectType ?t ; caselawp:defectCount ?n .
                ?t rdfs:label ?kind .
                OPTIONAL { ?d caselawp:defectExample ?example }
                # 文書の特徴（caselawp:pdfFeature）を1つのセルにまとめる。ラベルの無い特徴は IRI の「PDF特徴_」の後ろ。
                # Virtuoso は GROUP_CONCAT の区切りに日本語の文字を使うと「?」になるので ", " にする（2026.11.11）
                OPTIONAL {
                    SELECT ?entity (GROUP_CONCAT(DISTINCT ?fl; separator=", ") AS ?features)
                    WHERE {
                        ?entity caselawp:pdfFeature ?f .
                        OPTIONAL { ?f rdfs:label ?fl0 }
                        BIND(COALESCE(?fl0, STRAFTER(STR(?f), "PDF特徴_")) AS ?fl)
                    } GROUP BY ?entity
                }
                OPTIONAL { ?entity caselawp:pdfProducerTool ?producer }
                OPTIONAL { ?entity caselawp:pdfCreatorTool ?creator }
            } ORDER BY DESC(?year) ?id ?kind
    show:
        type: htable
        columns:
            - id: entity
              type: link
              string: "?id"
              label: ID
              width: 70
            - id: label
              label: 事件
              width: 200
            - id: year
              label: 年
              width: 50
            - id: kind
              label: 誤りの種類
              width: 110
            - id: n
              label: 箇所
              width: 50
            - id: example
              label: 例
              width: 320
            - id: features
              label: 文書の特徴
              width: 180
            - id: producer
              label: 作成ツール（Producer）
              width: 160
              collection:
                  view: PdfProblems
                  facet: pdf_producer
            - id: creator
              label: 元の文書の作成ツール（Creator）
              width: 140
-   def: gadget
    name: PdfDefectBar
    title: 誤りの種類ごとの判決文書の数
    get:
        type: sparql
        src: |
            SELECT ?kind (COUNT(DISTINCT ?entity) AS ?count)
            WHERE {
                $collection
                ?entity caselawp:pdfDefect ?t .
                ?t rdfs:label ?kind .
            } GROUP BY ?kind ORDER BY DESC(?count)
    show:
        type: chart
        chart: bar
        labels: kind
        dataset: count
-   def: gadget
    name: PdfDefectTable
    title: 誤りの種類（判決文書の数、箇所の合計、年の範囲）
    get:
        type: sparql
        src: |
            SELECT ?t ?kind ?comment (COUNT(DISTINCT ?entity) AS ?docs) (SUM(?n) AS ?total) (MIN(?year) AS ?from) (MAX(?year) AS ?to)
            WHERE {
                $collection
                ?entity caselawp:pdfDefectDetail ?d .
                ?d caselawp:defectType ?t ; caselawp:defectCount ?n .
                ?t rdfs:label ?kind .
                OPTIONAL { ?t rdfs:comment ?comment }
                OPTIONAL { ?entity caselawp:year ?year }
            } GROUP BY ?t ?kind ?comment ORDER BY DESC(?docs)
    show:
        type: htable
        columns:
            - id: kind
              label: 誤りの種類
              width: 130
              collection:
                  view: PdfProblems
                  facet: pdf_defect
                  value: t
            - id: docs
              label: 判決文書
              width: 70
            - id: total
              label: 箇所の合計
              width: 80
            - id: from
              label: 最も古い年
              width: 70
            - id: to
              label: 最も新しい年
              width: 70
            - id: comment
              label: 説明
              width: 420
-   def: gadget
    name: PdfDefectByProducer
    title: 作成ツール（Producer）× 誤りの種類（割合 = そのツールで作られたPDF全体のうち、その誤りのあるもの）
    get:
        type: sparql
        src: |
            SELECT ?producer ?kind (COUNT(DISTINCT ?entity) AS ?docs) ?all
                   (ROUND(1000.0 * COUNT(DISTINCT ?entity) / ?all) / 10 AS ?pct)
            WHERE {
                $collection
                ?entity caselawp:pdfProducerTool ?producer ; caselawp:pdfDefect ?t .
                ?t rdfs:label ?kind .
                { SELECT ?producer (COUNT(?x) AS ?all) WHERE { ?x caselawp:pdfProducerTool ?producer } GROUP BY ?producer }
            } GROUP BY ?producer ?kind ?all ORDER BY DESC(?docs)
            LIMIT 100
    show:
        type: htable
        columns:
            - id: producer
              label: 作成ツール（Producer）
              width: 300
              collection:
                  view: PdfProblems
                  facet: pdf_producer
            - id: kind
              label: 誤りの種類
              width: 120
            - id: docs
              label: 誤りのある判決文書
              width: 90
            - id: all
              label: そのツールのPDF全体
              width: 90
            - id: pct
              label: 割合（%）
              width: 70
-   def: gadget
    name: PdfDefectByCreator
    title: 元の文書の作成ツール（Creator）× 誤りの種類
    get:
