-   title: caselaw
-   describe: 日本の判例に関するデータ
-   rdfstore: virtuoso
-   label: rdfs:label
-   text_search: auto
# キーワードからトピックのコレクションを作る（/topic?q=パワーハラスメント|パワハラ。kgraphnavi/topic.py、docs/topic.md。2026.10.26）
#   種の判例 = タームのラベルにキーワードを含む判例（| で区切るといずれか）。リンク = 中心の参照（法令・条）。
#   偏りの大きい条は「主なリンク」（その条だけで入れる）、民法709条のように広く参照される条は「補助リンク」（語と一緒のときだけ確かさを上げる）。
#   作り手は hanrei の src/topic_keyword.py（略語・派生語への広げ、関連語、本文の語の数。builder: command。数分かかる）。
#   &builder=sparql を付けると、下の text_properties・link_properties で SPARQL だけで作る版（比べるため）
-   topic:
        builder: command
        command: ["{python}", "src/topic_keyword.py", "{q}", "--json", "{json}"]
        cwd: ~/nii/hanrei
        timeout: 900
        item_class: caselawo:CaseLawDocument
        text_properties: ["dcterms:subject/rdfs:label"]
        lang: ja
        link_properties: [caselawp:reflawCore]
        text_search: contains     # 日本語のタームは部分一致で探す（bif:contains は語の区切りが合わない）
        seed_max: 5000
# 少数（2〜4）の判例を列に並べて比べる（/compare?uri=A&uri=B…。kgraphnavi/compare.py。2026.10.26）
#   上訴審・原審（AppealCaseLaw の「審級を並べて比べる」）、保存したコレクション（4件まで）から。古い判決から左に並べる
#   gadget の行は各列にそのガジェットの表、align の行はその変数の値で行をそろえて、どの判例にあるか（違う行を色付け）
-   compare:
        - name: 判例
          title: 判例（審級・結果・争点・参照法令）
          types: [caselawo:CaseLawDocument, caselawo:Judgment, caselawo:Trial]
          sort: |
              select ?k where { graph <http://ds.rois.ac.jp/caselaw/> {
                  $uri caselawp:id ?id . ?j a caselawo:Judgment ; caselawp:id ?id ; caselawp:judgmentdate ?k }}
          rows:
              - gadget: CaseLawInfo
                title: 裁判所・判決日・結果
                columns: [court, judgmentdate, result, caseno, casename]
              - gadget: CaseLawInfo
                title: 判示事項・裁判要旨
                columns: [holding, headnote]
              - gadget: DocIssues
                title: 争点と結論
                columns: [label, outcome, otext]
              - gadget: Legislation
                title: 参照法令（行をそろえる）
                align: legislation
                label: label
                value: status
              - gadget: RefCase
                title: 参照判例（行をそろえる）
                align: ref
                label: reflabel
              - gadget: Keyword
                title: キーワード（行をそろえる）
                align: term
              - gadget: Judge
                title: 裁判官（行をそろえる）
                align: person
                value: role
-   data_dirs:          # /data/<名前>/<path> で配信する別のフォルダ（相対パスはこの設定ファイルのフォルダ基準。local.yaml で上書きできる）
        churoi: ../../churoi/data/lhtml    # 中労委の判例のHTML（/data/churoi/h00030.html）   # 候補の検索: auto（bif:contains が使えれば使う）/ bif / contains
        css: ../../churoi/data/css         # 中労委のHTMLが ../css/hanrei.css で参照するCSS（/data/css/hanrei.css）
-   static_dirs:        # /<名前>/<path> で配信するフォルダ（2026.10.19）
        css: ../../hanrei/data/css         # 判例のHTML（/data/<年>/<ID>_hanrei.html）が ../../css/hanrei.css で参照するCSS（/css/hanrei.css）
