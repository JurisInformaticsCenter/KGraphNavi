-   def: gadget
    name: CaseLawDocumentList
    title: 判決文書
    get:
        type: sparql
        page_size: 50
        src: |
            SELECT ?entity ?id ?casename ?suit ?year ?npages
            WHERE {
                $collection
                ?entity caselawp:id ?id .
                OPTIONAL { ?entity caselawp:year ?year }
                OPTIONAL { ?entity dcterms:extent ?npages }
                OPTIONAL {
                    ?trial a caselawo:Trial ;
                           caselawp:id ?id .
                    OPTIONAL { ?trial caselawp:casename ?casename }
                    OPTIONAL { ?trial caselawp:訴訟類型 ?suit }
                }
            }
    show:
        type: htable
        group_by: entity
        columns:
            - id: entity
              type: link
              string: "?id"
              label: ID
              width: 120
            - id: casename
              label: 事件名
              width: 360
            - id: suit
              label: 訴訟類型
              display: localname
              width: 100
            - id: year
              label: 年
              width: 60
            - id: npages
              label: ページ数
              width: 70
# 訴訟類型・分野・権利種別は裁判（Trial）、裁判種別は判決（Judgment）にある。
# 判決文書とは caselawp:id の値が同じなので、caselawp:id/^caselawp:id でたどる。
-   def: gadget
    name: facet_suit_type
