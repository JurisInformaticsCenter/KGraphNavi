                BIND (REPLACE(STR(?dbp), "^https?://ja.dbpedia.org/resource/", "") as ?name)
                BIND (IF(BOUND(?dbp), CONCAT("https://ja.wikipedia.org/wiki/", ENCODE_FOR_URI(?name)), ?unbound) as ?wikipedia)
