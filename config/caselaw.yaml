            WHERE {
                $collection
                ?entity caselawp:pdfCreatorTool ?creator ; caselawp:pdfDefect ?t .
                ?t rdfs:label ?kind .
                { SELECT ?creator (COUNT(?x) AS ?all) WHERE { ?x caselawp:pdfCreatorTool ?creator } GROUP BY ?creator }
            } GROUP BY ?creator ?kind ?all ORDER BY DESC(?docs)
            LIMIT 100
    show:
        type: htable
        columns:
            - id: creator
              label: 元の文書の作成ツール（Creator）
              width: 300
              collection:
                  view: PdfProblems
                  facet: pdf_creator
            - id: kind
              label: 誤りの種類
              width: 120
            - id: docs
              label: 誤りのある判決文書
              width: 90
            - id: all
              label: そのツールのPDF全体
              width: 90
            - id: pct
              label: 割合（%）
              width: 70
-   def: gadget
    name: PdfDefectByCreatedYear
