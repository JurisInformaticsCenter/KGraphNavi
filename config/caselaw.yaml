-   def: gadget
    name: ClauseInfo
    # 条(項)の見出し・状態・法令・解説(2026.10.18)。見出しは e-Gov の現行の法令のもの(src/lawcaption.py)。
    # データの文字列は CONCAT でつながない(Virtuoso で文字化けする)
    get:
        type: sparql
        src: |
            select ?label ?caption ?common ?status ?amd ?law ?lawlabel ?elaws ?commentary where {
            graph <http://ds.rois.ac.jp/caselaw/> {
                $uri rdfs:label ?label .
                OPTIONAL {$uri lawp:caption ?caption}
                OPTIONAL {$uri lawp:commonCaption ?common}
                OPTIONAL {$uri lawp:clauseStatus ?cs}
                OPTIONAL {$uri lawp:commentary ?commentary}
                OPTIONAL {$uri lawp:law ?law . OPTIONAL {?law rdfs:label ?lawlabel} OPTIONAL {?law owl:sameAs ?elaws}
                          OPTIONAL {?law lawp:del_flg ?del} OPTIONAL {?law lawp:lastAmendmentDate ?amd}}
                BIND (IF(COALESCE(STR(?del) = "1", false), "廃止法令", ?cs) AS ?status)
            }} limit 1
    show:
        type: vtable
        columns:
            - id: label
              label: 条
              width: 100
            - id: caption
              label: 見出し
            - id: common
              label: 共通見出し（前の条の見出し）
            - id: status
              label: 状態（現行の法令で）
            - id: amd
              label: 法令の最終改正の施行日
            - id: lawlabel
              label: 法令
              link: law
            - id: elaws
              label: e-Gov法令検索
              type: directlink
            - id: commentary
              label: 解説（Wikibooks）
              type: directlink
-   def: gadget
    name: ClauseText
    title: 条文
    # 条(項・号)の条文(~/nii/law の法令データ。sentence.ttl・lawstruct.ttl、e-Laws の2022年10月の版。2026.10.20)。
    # 文は項に付いているので、条のページでは lawp:upper をたどって下の項・号の文も出す。
    # 法令データは判例とは別のグラフに読み込むので、graph を指定しない。読み込んでいなければ何も出ない
    get:
        type: sparql
        src: |
            select ?clause ?label ?ci ?si ?text where {
                ?clause lawp:upper* $uri .
                ?s a lawo:Sentence ;
                   lawp:clause ?clause ;
                   doco:index ?si ;
                   cnt:chars ?text .
                OPTIONAL {?clause lawp:index ?ci}
                OPTIONAL {?clause rdfs:label ?label . FILTER (CONTAINS(STR(?label), "第"))}
            } order by ?ci ?clause ?si
            limit 300
    show:
        type: htable
        columns:
            - id: label
              label: 条項（2022年10月の版）
              link: clause
              width: 220
            - id: text
              label: 条文
              width: 600
