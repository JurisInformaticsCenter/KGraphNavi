{% extends "layout.html" %}

{% block content %}
<div class="container">
  <h1>検索結果 （{{ query }}）</h1>
 <table class="table table-striped">
    <thead>
    <tr><th>#</th><th>Resource</th><th>rdf:type</th></tr>
    </thead>
      {% for uri, label, type in result %}
    <tr><td>{{ loop.index }}</td>
      <td><a href='/resource?uri={{ uri|urlencode }}'>{{ label }}</a></td>
    <td>{{ type }}</td></tr>
      {% endfor %}
    </table>
</div>
{% endblock %}
